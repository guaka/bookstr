# Keep Electron packaging and native binary lookup compatible with npm's layout.
nodeLinker: hoisted
enablePrePostScripts: true
childConcurrency: 1
networkConcurrency: 4
onlyBuiltDependencies:
  - bufferutil
  - electron-winstaller
  - ip-set
  # Its committed pnpm patch permits prebuilt downloads only.
  - node-datachannel
  - utf-8-validate
  - utp-native
ignoredBuiltDependencies:
  - fsevents

patchedDependencies:
  # Preserve hoisted transitive versions before accepting package overrides.
  app-builder-lib@26.15.3: patches/app-builder-lib@26.15.3.patch
  node-datachannel@0.32.3: patches/node-datachannel@0.32.3.patch
