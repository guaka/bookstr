name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked APK binaries
        run: |
          tracked_apks="$(git ls-files '*.apk')"
          if [ -n "$tracked_apks" ]; then
            echo "APK binaries must be published as GitHub Release assets, not committed:"
            echo "$tracked_apks"
            exit 1
          fi

  web:
    name: Static web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check static web entrypoint
        run: test -f web/index.html
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run static web tests
        run: node --test web/tests/*.test.mjs
      - name: Install browser test runner
        run: npm install --no-save --no-package-lock @playwright/test@1.62.1 && npx playwright install --with-deps chromium
      - name: Test real EPUB reading
        run: npx playwright test --config web/playwright.config.mjs
