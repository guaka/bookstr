name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect web changes
    runs-on: ubuntu-latest
    outputs:
      web: ${{ (steps.filter.outputs.web_code == 'true' || (github.event_name != 'pull_request' && steps.filter.outputs.shared_coverage == 'true') || (github.event_name == 'pull_request' && steps.baseline.outputs.web == 'true')) && 'true' || 'false' }}
      electron: ${{ (steps.filter.outputs.electron_code == 'true' || (github.event_name != 'pull_request' && steps.filter.outputs.shared_coverage == 'true') || (github.event_name == 'pull_request' && steps.baseline.outputs.electron == 'true')) && 'true' || 'false' }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect web-related changes
        id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.3
        with:
          filters: |
            web_code:
              - 'web/**'
              - 'shared/architecture/**'
              - 'shared/reader/**'
              - 'worker/**'
              - 'shared/catalog/**'
              - 'shared/design-tokens/**'
              - 'docs/CLIENT_CAPABILITIES.md'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
              - '.nvmrc'
            electron_code:
              - 'desktop/**'
              - 'web/**'
              - 'shared/**'
              - '!shared/coverage/**'
              - 'scripts/coverage-ratchet.mjs'
              - 'scripts/test-overview.mjs'
              - '.github/workflows/ci.yml'
              - '.nvmrc'
            shared_coverage:
              - 'shared/coverage/**'
            workflows:
              - '.github/workflows/**'
              - '.github/required-checks.json'
              - 'scripts/platform-baseline-routing.mjs'
              - 'scripts/platform-baseline-routing-cli.mjs'
              - 'scripts/platform-baseline-routing.test.mts'
              - 'scripts/workflows.test.mts'
      - name: Compare web and Electron coverage floors with pull request base
        id: baseline
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if ! git fetch --no-tags --depth=1 origin "$PR_BASE_SHA"; then
            echo 'web=true' >> "$GITHUB_OUTPUT"
            echo 'electron=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git show "$PR_BASE_SHA:shared/coverage/baselines-v1.json" > "$RUNNER_TEMP/base-baselines.json"; then
            echo 'web=true' >> "$GITHUB_OUTPUT"
            echo 'electron=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for suite in web electron; do
            result=$(node scripts/platform-baseline-routing-cli.mjs --suite "$suite" --base "$RUNNER_TEMP/base-baselines.json" --head shared/coverage/baselines-v1.json)
            echo "$suite=$result" >> "$GITHUB_OUTPUT"
          done

  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked APK binaries
        run: |
          tracked_apks="$(git ls-files '*.apk')"
          if [ -n "$tracked_apks" ]; then
            echo "APK binaries must be published as GitHub Release assets, not committed:"
            echo "$tracked_apks"
            exit 1
          fi

  workflow-contracts:
    name: Workflow contracts
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Test workflow contracts
        run: node --test scripts/workflows.test.mts scripts/platform-baseline-routing.test.mts

  web:
    name: Static web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=768
    steps:
      - uses: actions/checkout@v4
      - name: Check static web entrypoint
        run: test -f web/index.html
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.8
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Check TypeScript and pinned browser assets
        run: |
          pnpm --dir web install --frozen-lockfile --ignore-scripts
          pnpm --dir web run typecheck
          pnpm --dir web run typecheck:worker
          node scripts/typescript.cts --check
          node shared/build-typescript.mts --check
          GOMEMLIMIT=512MiB GOMAXPROCS=2 node --max-old-space-size=512 web/node_modules/typescript/bin/tsc -p shared/tsconfig.json
          pnpm --dir web run check:generated
          pnpm --dir web run check:vendor
      - name: Run static web tests
        id: web_tests
        continue-on-error: true
        run: |
          started=$(date +%s)
          set +e
          node scripts/generate-client-overview.mjs --check
          node shared/reader/generate-web-assets.mjs --check
          node shared/design-tokens/generate.mjs --check
          node shared/catalog/generate-provider-record-dtos.mjs --check
          node shared/contracts/generate-nostr-constants.mjs --check
          node --test --experimental-test-coverage --test-coverage-lines=100 --test-coverage-branches=100 --test-coverage-functions=100 scripts/coverage-ratchet.test.mts
          node --test --experimental-test-coverage --test-coverage-lines=100 --test-coverage-branches=100 --test-coverage-functions=100 scripts/typescript.test.mts
          node --test --experimental-test-coverage --test-coverage-lines=100 --test-coverage-branches=100 --test-coverage-functions=100 shared/build-typescript.test.mts
          node --test --test-concurrency=1 --test-reporter=tap web/tests/*.test.mts worker/src/*.test.mts scripts/*.test.mts shared/build-typescript.test.mts shared/catalog/*.test.mts shared/contracts/*.test.mts shared/design-tokens/*.test.mts shared/reader/*.test.mts | tee web-tests.tap
          status=${PIPESTATUS[0]}
          echo "duration_ms=$((($(date +%s) - started) * 1000))" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Generate web test coverage
        id: web_coverage
        if: always()
        continue-on-error: true
        run: |
          node web/node_modules/c8/bin/c8.js \
            --extension=.ts --extension=.js --extension=.mjs --extension=.cts --extension=.mts \
            --exclude='**/*.test.*' --exclude-after-remap \
            --report-dir web/coverage/web-tests \
            --reporter=html \
            --reporter=lcov \
            --reporter=json-summary \
            --reporter=text \
            node --test --test-concurrency=1 web/tests/*.test.mts worker/src/*.test.mts shared/build-typescript.test.mts shared/catalog/*.test.mts shared/contracts/*.test.mts shared/design-tokens/*.test.mts shared/reader/*.test.mts
      - name: Archive web coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bookstr-web-coverage-${{ github.sha }}
          path: web/coverage/web-tests/
      - name: Install browser test runner
        if: always()
        run: pnpm --dir web exec playwright install --with-deps chromium
      - name: Test real EPUB reading
        id: web_e2e
        if: always()
        continue-on-error: true
        run: |
          started=$(date +%s)
          set +e
          node web/node_modules/@playwright/test/cli.js test --config web/playwright.config.mts --workers=1 --reporter=json > web-playwright.json
          status=$?
          echo "duration_ms=$((($(date +%s) - started) * 1000))" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Upload web Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bookstr-web-playwright-${{ github.run_id }}
          path: web-playwright.json
          if-no-files-found: warn
      - name: Upload web e2e screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bookstr-e2e-screenshots-web-${{ github.run_id }}
          path: web/test-results/**/*.png
          if-no-files-found: error
      - name: Record web test overview
        if: always()
        env:
          UNIT_STATUS: ${{ steps.web_tests.outcome == 'success' && steps.web_coverage.outcome == 'success' && 'passing' || 'failing' }}
          E2E_STATUS: ${{ steps.web_e2e.outcome == 'success' && 'passing' || 'failing' }}
          UNIT_DURATION_MS: ${{ steps.web_tests.outputs.duration_ms }}
          E2E_DURATION_MS: ${{ steps.web_e2e.outputs.duration_ms }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node scripts/test-overview.mjs record --id web --suite Web --status "$UNIT_STATUS" --results-format tap --results web-tests.tap --coverage-format istanbul --coverage web/coverage/web-tests/coverage-summary.json --duration-ms "$UNIT_DURATION_MS" --output test-overview/web.json --recorded "$(date -u +%FT%TZ)" --run-url "$RUN_URL" --commit "$GITHUB_SHA"
          node scripts/test-overview.mjs record --id web-e2e --suite "Web e2e" --status "$E2E_STATUS" --results-format playwright --results web-playwright.json --duration-ms "$E2E_DURATION_MS" --output test-overview/web-e2e.json --recorded "$(date -u +%FT%TZ)" --run-url "$RUN_URL" --commit "$GITHUB_SHA"
      - name: Enforce web coverage baseline
        if: always()
        run: node scripts/coverage-ratchet.mjs --suite web --report test-overview/web.json
      - name: Upload web test overview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bookstr-test-overview-web-${{ github.run_id }}
          path: test-overview/*.json
      - name: Fail unsuccessful web checks
        if: always() && (steps.web_tests.outcome != 'success' || steps.web_coverage.outcome != 'success' || steps.web_e2e.outcome != 'success')
        run: exit 1

  electron:
    name: Electron
    needs: changes
    if: needs.changes.outputs.electron == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.8
          package_json_file: desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - name: Install desktop dependencies
        run: pnpm install --frozen-lockfile
      - name: Check desktop TypeScript
        run: pnpm run typecheck
      - name: Run Electron unit coverage
        id: electron_tests
        continue-on-error: true
        run: |
          started=$(date +%s)
          set +e
          pnpm run test:coverage:ci | tee electron-tests.tap
          status=${PIPESTATUS[0]}
          echo "duration_ms=$((($(date +%s) - started) * 1000))" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Upload Electron unit coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bookstr-electron-unit-coverage-${{ github.sha }}
          path: desktop/electron-tests.tap
      - name: Install Electron test dependencies
        if: always()
        run: pnpm exec playwright install-deps
      - name: Run Electron smoke and local WebTorrent tests
        id: electron_e2e
        if: always()
        continue-on-error: true
        run: |
          started=$(date +%s)
          set +e
          pnpm run test:e2e:torrent
          torrent_status=$?
          xvfb-run -a pnpm exec playwright test tests/e2e/desktop.smoke.spec.ts tests/e2e/desktop.device-transfer.spec.ts --reporter=json > electron-playwright.json
          status=$?
          if [ "$torrent_status" -ne 0 ]; then status="$torrent_status"; fi
          echo "duration_ms=$((($(date +%s) - started) * 1000))" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Upload Electron Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bookstr-electron-playwright-${{ github.run_id }}
          path: desktop/electron-playwright.json
          if-no-files-found: warn
      - name: Record Electron test overview
        if: always()
        working-directory: .
        env:
          UNIT_STATUS: ${{ steps.electron_tests.outcome == 'success' && 'passing' || 'failing' }}
          E2E_STATUS: ${{ steps.electron_e2e.outcome == 'success' && 'passing' || 'failing' }}
          UNIT_DURATION_MS: ${{ steps.electron_tests.outputs.duration_ms }}
          E2E_DURATION_MS: ${{ steps.electron_e2e.outputs.duration_ms }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node scripts/test-overview.mjs record --id electron --suite Electron --status "$UNIT_STATUS" --results-format tap --results desktop/electron-tests.tap --coverage-format node --coverage desktop/electron-tests.tap --duration-ms "$UNIT_DURATION_MS" --output test-overview/electron.json --recorded "$(date -u +%FT%TZ)" --run-url "$RUN_URL" --commit "$GITHUB_SHA"
          node scripts/test-overview.mjs record --id electron-e2e --suite "Electron e2e" --status "$E2E_STATUS" --results-format playwright --results desktop/electron-playwright.json --duration-ms "$E2E_DURATION_MS" --output test-overview/electron-e2e.json --recorded "$(date -u +%FT%TZ)" --run-url "$RUN_URL" --commit "$GITHUB_SHA"
      - name: Upload Electron e2e screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bookstr-e2e-screenshots-electron-${{ github.run_id }}
          path: desktop/test-results/**/*.png
          if-no-files-found: error
      - name: Enforce Electron coverage baseline
        if: always()
        working-directory: .
        run: node scripts/coverage-ratchet.mjs --suite electron --report test-overview/electron.json
      - name: Upload Electron test overview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bookstr-test-overview-electron-${{ github.run_id }}
          path: test-overview/*.json
      - name: Fail unsuccessful Electron checks
        if: always() && (steps.electron_tests.outcome != 'success' || steps.electron_e2e.outcome != 'success')
        run: exit 1
