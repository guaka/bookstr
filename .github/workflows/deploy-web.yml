name: Deploy web to GitHub Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check static web entrypoint
        run: test -f web/index.html
      - name: Find latest completed test runs
        id: runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          latest_run_with_artifact() {
            workflow="$1"
            artifact_prefix="$2"
            for run_id in $(gh api "repos/$GH_REPO/actions/workflows/$workflow/runs?branch=main&status=completed&per_page=30" --jq '.workflow_runs[].id'); do
              if gh api "repos/$GH_REPO/actions/runs/$run_id/artifacts" --jq '.artifacts[].name' | grep -q "^${artifact_prefix}[0-9][0-9]*$"; then
                echo "$run_id"
                return
              fi
            done
            echo 0
          }
          echo "ci=$(latest_run_with_artifact ci.yml bookstr-test-overview-web-)" >> "$GITHUB_OUTPUT"
          echo "android=$(latest_run_with_artifact android.yml bookstr-test-overview-android-)" >> "$GITHUB_OUTPUT"
          echo "android_ui=$(latest_run_with_artifact android.yml bookstr-test-overview-android-ui-)" >> "$GITHUB_OUTPUT"
          echo "ios=$(latest_run_with_artifact ios.yml bookstr-test-overview-ios-)" >> "$GITHUB_OUTPUT"
      - name: Download latest web results
        if: steps.runs.outputs.ci != '0'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.runs.outputs.ci }}
          pattern: bookstr-test-overview-web-*
          path: test-overview-data
          merge-multiple: true
          github-token: ${{ github.token }}
      - name: Download latest Android results
        if: steps.runs.outputs.android != '0'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.runs.outputs.android }}
          name: bookstr-test-overview-android-${{ steps.runs.outputs.android }}
          path: test-overview-data
          merge-multiple: true
          github-token: ${{ github.token }}
      - name: Download latest Android UI results
        if: steps.runs.outputs.android_ui != '0'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.runs.outputs.android_ui }}
          name: bookstr-test-overview-android-ui-${{ steps.runs.outputs.android_ui }}
          path: test-overview-data
          merge-multiple: true
          github-token: ${{ github.token }}
      - name: Download latest iOS results
        if: steps.runs.outputs.ios != '0'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.runs.outputs.ios }}
          pattern: bookstr-test-overview-ios-*
          path: test-overview-data
          merge-multiple: true
          github-token: ${{ github.token }}
      - name: Generate test overview
        run: node scripts/test-overview.mjs render --input test-overview-data --output web/tests/index.html
      - name: Add documentation
        run: |
          mkdir -p web/docs
          cp -R docs/. web/docs/
          cp README.md web/docs/README.md
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'success')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
