name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'catalog/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check static web entrypoint
        run: test -f web/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment_1.outputs.page_url || steps.deployment_2.outputs.page_url || steps.deployment_3.outputs.page_url }}
    steps:
      - name: Deploy to Pages (attempt 1)
        id: deployment_1
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before retry
        if: steps.deployment_1.outcome == 'failure'
        run: sleep 30
      - name: Deploy to Pages (attempt 2)
        id: deployment_2
        if: steps.deployment_1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before final retry
        if: steps.deployment_1.outcome == 'failure' && steps.deployment_2.outcome == 'failure'
        run: sleep 60
      - name: Deploy to Pages (attempt 3)
        id: deployment_3
        if: steps.deployment_1.outcome == 'failure' && steps.deployment_2.outcome == 'failure'
        uses: actions/deploy-pages@v4
