name: iOS CI

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'shared/reader/**'
      - 'shared/coverage/**'
      - 'scripts/coverage-ratchet.mjs'
      - 'scripts/test-overview.mjs'
      - '.github/workflows/ios.yml'
      - '.nvmrc'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Route iOS checks
    # iOS work is paused. Keep required checks visible without allocating runners.
    if: ${{ false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ios: ${{ (github.event_name != 'pull_request' || steps.filter.outputs.ios_code == 'true' || steps.baseline.outputs.ios == 'true') && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            ios_code:
              - 'ios/**'
              - 'shared/reader/**'
              - 'scripts/coverage-ratchet.mjs'
              - 'scripts/test-overview.mjs'
              - '.nvmrc'
      - name: Compare iOS coverage floor with pull request base
        id: baseline
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if ! git fetch --no-tags --depth=1 origin "$PR_BASE_SHA"; then
            echo 'ios=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git show "$PR_BASE_SHA:shared/coverage/baselines-v1.json" > "$RUNNER_TEMP/base-baselines.json"; then
            echo 'ios=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git show "$PR_BASE_SHA:.github/workflows/ios.yml" > "$RUNNER_TEMP/base-ios.yml"; then
            echo 'ios=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          result=$(node scripts/platform-baseline-routing-cli.mjs --suite ios --base "$RUNNER_TEMP/base-baselines.json" --head shared/coverage/baselines-v1.json --workflow-base "$RUNNER_TEMP/base-ios.yml" --workflow-head .github/workflows/ios.yml)
          echo "ios=$result" >> "$GITHUB_OUTPUT"

  ios:
    name: iOS
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Run fast iOS logic tests
        id: ios_tests
        continue-on-error: true
        run: |
          started=$(date +%s)
          set +e
          swift test --package-path ios --enable-code-coverage 2>&1 | tee ios/swift-test-results.log
          status=${PIPESTATUS[0]}
          echo "duration_ms=$((($(date +%s) - started) * 1000))" >> "$GITHUB_OUTPUT"
          coverage_path=$(find ios/.build -path '*/codecov/BookstrLogic.json' -print -quit)
          echo "coverage_path=$coverage_path" >> "$GITHUB_OUTPUT"
          if [ ! -s "$coverage_path" ]; then status=1; fi
          exit "$status"
      - name: Record iOS test overview
        if: always()
        env:
          TEST_STATUS: ${{ steps.ios_tests.outcome == 'success' && 'passing' || 'failing' }}
          TEST_DURATION_MS: ${{ steps.ios_tests.outputs.duration_ms }}
          COVERAGE_PATH: ${{ steps.ios_tests.outputs.coverage_path }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          KNOWN_TESTS=$(grep -h -E '^[[:space:]]*func test' ios/BookstrIOS/Tests/{DeviceTransferCoreTests,DeviceTransferTransportTests,LocalBookImportTests,TorrentDownloadTests,CatalogConnectionTests,CatalogSearchPageTests,DictionaryRepositoryTests,FavoritesParserTests,NostrClientProgressTests,ProgressRepositoryTests,ReaderAssetContractTests,ReaderPlaybackSessionTests,ReaderRelocationTests,ReaderSelectionActionsTests,SettingsRepositoryTests,SpeechLanguageSettingsTests,SpeechModelStoreTests,NeuralSpeechSessionTests,SnippetRepositoryTests,BookstrDebugLogTests,VocabularyRepositoryTests,WordNavigationStateTests,WordSortOrderingTests}.swift | wc -l | tr -d ' ')
          node scripts/test-overview.mjs record --id ios --suite iOS --status "$TEST_STATUS" --results-format swift --results ios/swift-test-results.log --coverage-format llvm --coverage "$COVERAGE_PATH" --known-tests "$KNOWN_TESTS" --duration-ms "$TEST_DURATION_MS" --output test-overview/ios.json --recorded "$(date -u +%FT%TZ)" --run-url "$RUN_URL" --commit "$GITHUB_SHA"
      - name: Enforce iOS coverage baseline
        if: always()
        run: node scripts/coverage-ratchet.mjs --suite ios --report test-overview/ios.json
      - name: Prepare iOS simulator
        id: simulator
        timeout-minutes: 2
        run: |
          for attempt in {1..12}; do
            DEVICE_ID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.isAvailable == true and (.name | startswith("iPhone")))] | first | .udid // empty')
            if [ -n "$DEVICE_ID" ]; then break; fi
            sleep 5
          done
          if [ -z "$DEVICE_ID" ]; then
            echo "No available iPhone simulator was found" >&2
            exit 1
          fi
          echo "id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
      - name: Build native iPhone torrent engine
        run: |
          brew list cmake >/dev/null 2>&1 || brew install cmake
          brew list boost >/dev/null 2>&1 || brew install boost
          BOOST_ROOT="$(brew --prefix boost)" scripts/ensure-ios-torrent.sh
      - name: Build iOS e2e tests
        timeout-minutes: 15
        run: |
          xcodebuild build-for-testing \
            -project ios/BookstrIOS.xcodeproj \
            -scheme BookstrIOS \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -derivedDataPath "$RUNNER_TEMP/BookstrIOSDerivedData" \
            -only-testing:BookstrIOSUITests \
            -only-testing:BookstrIOSTests/ReaderAssetContractTests \
            -only-testing:BookstrIOSTests/AppContainerTests \
            -only-testing:BookstrIOSTests/TorrentDownloadTests \
            -only-testing:BookstrIOSTests/FavoritesParserTests/testRealPdfIsAccepted \
            -only-testing:BookstrIOSTests/FavoritesParserTests/testPublicDomainAlicePdfFixtureIsAcceptedAndHasReadableText \
            -only-testing:BookstrIOSTests/FavoritesParserTests/testPublicDomainAliceEpubFixtureIsAccepted \
            -only-testing:BookstrIOSTests/FavoritesParserTests/testPublicDomainAliceEpubActuallyReachesReadyReader \
            -only-testing:BookstrIOSTests/FavoritesParserTests/testEPUBReaderCanAdjustFontPercentViaReaderAPI \
            -parallel-testing-enabled NO \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO
      - name: Run iOS e2e tests
        id: ios_e2e_tests
        continue-on-error: true
        timeout-minutes: 30
        run: |
          started=$(date +%s)
          set +e
          xcodebuild test-without-building \
            -project ios/BookstrIOS.xcodeproj \
            -scheme BookstrIOS \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -derivedDataPath "$RUNNER_TEMP/BookstrIOSDerivedData" \
            -only-testing:BookstrIOSUITests \
            -only-testing:BookstrIOSTests/ReaderAssetContractTests \
            -only-testing:BookstrIOSTests/AppContainerTests \
            -only-testing:BookstrIOSTests/TorrentDownloadTests \
            -only-testing:BookstrIOSTests/FavoritesParserTests/testRealPdfIsAccepted \
            -only-testing:BookstrIOSTests/FavoritesParserTests/testPublicDomainAlicePdfFixtureIsAcceptedAndHasReadableText \
            -only-testing:BookstrIOSTests/FavoritesParserTests/testPublicDomainAliceEpubFixtureIsAccepted \
            -only-testing:BookstrIOSTests/FavoritesParserTests/testPublicDomainAliceEpubActuallyReachesReadyReader \
            -only-testing:BookstrIOSTests/FavoritesParserTests/testEPUBReaderCanAdjustFontPercentViaReaderAPI \
            -parallel-testing-enabled NO \
            -resultBundlePath ios/E2EResults.xcresult \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO
          status=$?
          echo "duration_ms=$((($(date +%s) - started) * 1000))" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Extract iOS e2e results
        id: ios_e2e_results
        if: always()
        continue-on-error: true
        run: xcrun xcresulttool get test-results summary --path ios/E2EResults.xcresult > ios/e2e-summary.json
      - name: Extract iOS e2e screenshots
        if: always()
        continue-on-error: true
        run: xcrun xcresulttool export attachments --path ios/E2EResults.xcresult --output-path ios/e2e-screenshots
      - name: Record iOS e2e overview
        if: always()
        env:
          TEST_STATUS: ${{ steps.ios_e2e_tests.outcome == 'success' && steps.ios_e2e_results.outcome == 'success' && 'passing' || 'failing' }}
          TEST_DURATION_MS: ${{ steps.ios_e2e_tests.outputs.duration_ms }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          UI_TESTS=$(grep -R -h -E '^[[:space:]]*func test' ios/BookstrIOS/UITests --include='*.swift' | wc -l | tr -d ' ')
          KNOWN_TESTS=$((UI_TESTS + 7))
          node scripts/test-overview.mjs record --id ios-e2e --suite "iOS e2e" --status "$TEST_STATUS" --results-format xcresult --results ios/e2e-summary.json --known-tests "$KNOWN_TESTS" --duration-ms "$TEST_DURATION_MS" --output test-overview/ios-e2e.json --recorded "$(date -u +%FT%TZ)" --run-url "$RUN_URL" --commit "$GITHUB_SHA"
      - name: Upload iOS test overview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bookstr-test-overview-ios-${{ github.run_id }}
          path: test-overview/*.json
      - name: Upload iOS test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bookstr-ios-test-diagnostics-${{ github.run_id }}
          path: |
            ios/swift-test-results.log
            ios/e2e-summary.json
      - name: Upload iOS e2e screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bookstr-e2e-screenshots-ios-${{ github.run_id }}
          path: ios/e2e-screenshots/**/*.png
          if-no-files-found: error
      - name: Fail unsuccessful iOS checks
        if: always() && (steps.ios_tests.outcome != 'success' || steps.ios_e2e_tests.outcome != 'success' || steps.ios_e2e_results.outcome != 'success')
        run: exit 1
