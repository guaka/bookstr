name: iOS CI

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'scripts/test-overview.mjs'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - 'scripts/test-overview.mjs'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and run unit tests
        id: ios_tests
        continue-on-error: true
        run: |
          xcodebuild test \
            -project ios/BookstrIOS.xcodeproj \
            -scheme BookstrIOS \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -only-testing:BookstrIOSTests \
            -enableCodeCoverage YES \
            -resultBundlePath ios/TestResults.xcresult \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO
      - name: Extract iOS test results
        id: ios_results
        if: always()
        continue-on-error: true
        run: |
          xcrun xcresulttool get test-results summary --path ios/TestResults.xcresult > ios/test-summary.json
          xcrun xccov view --report --json ios/TestResults.xcresult > ios/coverage.json
      - name: Record iOS test overview
        if: always()
        env:
          TEST_STATUS: ${{ steps.ios_tests.outcome == 'success' && steps.ios_results.outcome == 'success' && 'passing' || 'failing' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          KNOWN_TESTS=$(grep -R -h -E '^[[:space:]]*func test' ios/BookstrIOS/Tests --include='*.swift' | wc -l | tr -d ' ')
          node scripts/test-overview.mjs record --id ios --suite iOS --status "$TEST_STATUS" --results-format xcresult --results ios/test-summary.json --coverage-format xccov --coverage ios/coverage.json --known-tests "$KNOWN_TESTS" --output test-overview/ios.json --recorded "$(date -u +%FT%TZ)" --run-url "$RUN_URL" --commit "$GITHUB_SHA"
      - name: Build and run e2e tests
        id: ios_e2e_tests
        continue-on-error: true
        run: |
          xcodebuild test \
            -project ios/BookstrIOS.xcodeproj \
            -scheme BookstrIOS \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -only-testing:BookstrIOSUITests \
            -resultBundlePath ios/E2EResults.xcresult \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO
      - name: Extract iOS e2e results
        id: ios_e2e_results
        if: always()
        continue-on-error: true
        run: xcrun xcresulttool get test-results summary --path ios/E2EResults.xcresult > ios/e2e-summary.json
      - name: Record iOS e2e overview
        if: always()
        env:
          TEST_STATUS: ${{ steps.ios_e2e_tests.outcome == 'success' && steps.ios_e2e_results.outcome == 'success' && 'passing' || 'failing' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          KNOWN_TESTS=$(grep -R -h -E '^[[:space:]]*func test' ios/BookstrIOS/UITests --include='*.swift' | wc -l | tr -d ' ')
          node scripts/test-overview.mjs record --id ios-e2e --suite "iOS e2e" --status "$TEST_STATUS" --results-format xcresult --results ios/e2e-summary.json --known-tests "$KNOWN_TESTS" --output test-overview/ios-e2e.json --recorded "$(date -u +%FT%TZ)" --run-url "$RUN_URL" --commit "$GITHUB_SHA"
      - name: Upload iOS test overview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bookstr-test-overview-ios-${{ github.run_id }}
          path: |
            test-overview/ios.json
            test-overview/ios-e2e.json
            ios/test-summary.json
            ios/e2e-summary.json
            ios/coverage.json
      - name: Fail unsuccessful iOS checks
        if: always() && (steps.ios_tests.outcome != 'success' || steps.ios_results.outcome != 'success' || steps.ios_e2e_tests.outcome != 'success' || steps.ios_e2e_results.outcome != 'success')
        run: exit 1
