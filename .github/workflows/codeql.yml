name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '31 3 * * 4'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect language changes
    runs-on: ubuntu-latest
    outputs:
      actions: ${{ steps.filter.outputs.actions }}
      java_kotlin: ${{ steps.filter.outputs.java_kotlin }}
      javascript_typescript: ${{ steps.filter.outputs.javascript_typescript }}
      python: ${{ steps.filter.outputs.python }}
      swift: ${{ steps.filter.outputs.swift }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect language-specific changes
        id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.3
        with:
          filters: |
            actions:
              - '.github/actions/**'
              - '.github/workflows/**'
              - 'action.yml'
              - 'action.yaml'
            java_kotlin:
              - 'android/**'
              - '.github/workflows/codeql.yml'
            javascript_typescript:
              - 'desktop/**'
              - 'scripts/**'
              - 'web/**'
              - 'worker/**'
              - '**/*.cjs'
              - '**/*.js'
              - '**/*.jsx'
              - '**/*.mjs'
              - '**/*.ts'
              - '**/*.tsx'
              - '.github/workflows/codeql.yml'
            python:
              - '**/*.py'
              - '**/Pipfile'
              - '**/Pipfile.lock'
              - '**/poetry.lock'
              - '**/pyproject.toml'
              - '**/requirements*.txt'
              - '.github/workflows/codeql.yml'
            swift:
              - 'ios/**'
              - '.github/workflows/codeql.yml'

  actions:
    name: Analyze (actions)
    needs: changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.actions == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: actions
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4

  java-kotlin:
    name: Analyze (java-kotlin)
    needs: changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.java_kotlin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: java-kotlin
          build-mode: autobuild
      - name: Autobuild
        uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4

  javascript-typescript:
    name: Analyze (javascript-typescript)
    needs: changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.javascript_typescript == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: javascript-typescript
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4

  python:
    name: Analyze (python)
    needs: changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: python
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4

  swift:
    name: Analyze (swift)
    needs: changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.swift == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: swift
          build-mode: autobuild
      - name: Autobuild
        uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
