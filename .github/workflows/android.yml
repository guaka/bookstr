name: Android CI

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'shared/reader/**'
      - 'shared/coverage/**'
      - 'scripts/coverage-ratchet.mjs'
      - 'scripts/test-overview.mjs'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'shared/reader/**'
      - 'shared/coverage/**'
      - 'scripts/coverage-ratchet.mjs'
      - 'scripts/test-overview.mjs'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "system-images;android-30;google_apis;x86_64"
      - name: Unit tests, coverage, and debug APK
        id: android_build
        continue-on-error: true
        run: |
          started=$(date +%s)
          set +e
          ./gradlew --no-daemon --continue testDebugUnitTest jacocoDebugUnitTestReport assembleDebug
          status=$?
          echo "duration_ms=$((($(date +%s) - started) * 1000))" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Upload unit test coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bookstr-android-unit-coverage-${{ github.sha }}
          path: android/app/build/reports/jacoco/
      - name: Record Android test overview
        if: always()
        working-directory: .
        env:
          TEST_STATUS: ${{ steps.android_build.outcome == 'success' && 'passing' || 'failing' }}
          TEST_DURATION_MS: ${{ steps.android_build.outputs.duration_ms }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          coverage_xml="$(find android/app/build/reports/jacoco -name '*.xml' -print -quit 2>/dev/null || true)"
          KNOWN_TESTS=$(grep -R -h -E '^[[:space:]]*@Test' android/app/src/test --include='*.kt' | wc -l | tr -d ' ')
          node scripts/test-overview.mjs record --id android --suite Android --status "$TEST_STATUS" --results-format junit --results android/app/build/test-results/testDebugUnitTest --coverage-format jacoco --coverage "$coverage_xml" --known-tests "$KNOWN_TESTS" --duration-ms "$TEST_DURATION_MS" --output test-overview/android.json --recorded "$(date -u +%FT%TZ)" --run-url "$RUN_URL" --commit "$GITHUB_SHA"
      - name: Enforce Android coverage baseline
        if: always()
        working-directory: .
        run: node scripts/coverage-ratchet.mjs --suite android --report test-overview/android.json
      - name: Upload Android test overview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bookstr-test-overview-android-${{ github.run_id }}
          path: test-overview/android.json
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start Android UI timer
        id: ui_timer
        working-directory: .
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Compose UI tests
        id: ui_tests
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          script: cd android && ./gradlew --no-daemon connectedDebugAndroidTest
      - name: Record Android UI test overview
        if: always()
        working-directory: .
        env:
          TEST_STATUS: ${{ steps.ui_tests.outcome == 'success' && 'passing' || 'failing' }}
          TEST_STARTED: ${{ steps.ui_timer.outputs.started }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TEST_DURATION_MS=$((($(date +%s) - TEST_STARTED) * 1000))
          KNOWN_TESTS=$(grep -R -h -E '^[[:space:]]*@Test' android/app/src/androidTest --include='*.kt' | wc -l | tr -d ' ')
          node scripts/test-overview.mjs record --id android-ui --suite "Android e2e" --status "$TEST_STATUS" --results-format junit --results android/app/build/outputs/androidTest-results --known-tests "$KNOWN_TESTS" --duration-ms "$TEST_DURATION_MS" --output test-overview/android-ui.json --recorded "$(date -u +%FT%TZ)" --run-url "$RUN_URL" --commit "$GITHUB_SHA"
      - name: Upload Android UI test overview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bookstr-test-overview-android-ui-${{ github.run_id }}
          path: test-overview/android-ui.json
      - name: Fail unsuccessful Android checks
        if: always() && (steps.android_build.outcome != 'success' || steps.ui_tests.outcome != 'success')
        run: exit 1
