name: Android CI

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'shared/reader/**'
      - 'web/reader-speech.js'
      - 'web/reader-typography.js'
      - 'web/reader-chrome.js'
      - 'web/comic-reader.html'
      - 'web/vendor/libarchive.js'
      - 'web/vendor/libarchive.wasm'
      - 'shared/coverage/**'
      - 'scripts/coverage-ratchet.mjs'
      - 'scripts/test-overview.mjs'
      - '.github/workflows/android.yml'
      - 'scripts/workflows.test.mjs'
  pull_request:
    paths:
      - 'android/**'
      - 'shared/reader/**'
      - 'web/reader-speech.js'
      - 'web/reader-typography.js'
      - 'web/reader-chrome.js'
      - 'web/comic-reader.html'
      - 'web/vendor/libarchive.js'
      - 'web/vendor/libarchive.wasm'
      - 'shared/coverage/**'
      - 'scripts/coverage-ratchet.mjs'
      - 'scripts/test-overview.mjs'
      - '.github/workflows/android.yml'
      - 'scripts/workflows.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "system-images;android-30;google_apis;x86_64" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Install torrent build headers
        run: sudo apt-get update && sudo apt-get install -y libboost-dev
      - name: Unit tests, coverage, and debug APK
        id: android_build
        continue-on-error: true
        run: |
          started=$(date +%s)
          set +e
          ./gradlew --no-daemon --continue testDebugUnitTest jacocoDebugUnitTestReport assembleDebug
          status=$?
          echo "duration_ms=$((($(date +%s) - started) * 1000))" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Upload debug APK
        if: steps.android_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: bookstr-android-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload unit test coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bookstr-android-unit-coverage-${{ github.sha }}
          path: android/app/build/reports/jacoco/
      - name: Record Android test overview
        if: always()
        working-directory: .
        env:
          TEST_STATUS: ${{ steps.android_build.outcome == 'success' && 'passing' || 'failing' }}
          TEST_DURATION_MS: ${{ steps.android_build.outputs.duration_ms }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          coverage_xml="$(find android/app/build/reports/jacoco -name '*.xml' -print -quit 2>/dev/null || true)"
          KNOWN_TESTS=$(grep -R -h -E '^[[:space:]]*@Test' android/app/src/test --include='*.kt' | wc -l | tr -d ' ')
          node scripts/test-overview.mjs record --id android --suite Android --status "$TEST_STATUS" --results-format junit --results android/app/build/test-results/testDebugUnitTest --coverage-format jacoco --coverage "$coverage_xml" --known-tests "$KNOWN_TESTS" --duration-ms "$TEST_DURATION_MS" --output test-overview/android.json --recorded "$(date -u +%FT%TZ)" --run-url "$RUN_URL" --commit "$GITHUB_SHA"
      - name: Enforce Android coverage baseline
        if: always()
        working-directory: .
        run: node scripts/coverage-ratchet.mjs --suite android --report test-overview/android.json
      - name: Upload Android test overview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bookstr-test-overview-android-${{ github.run_id }}
          path: test-overview/android.json
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start Android UI timer
        id: ui_timer
        working-directory: .
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Compose UI tests
        id: ui_tests
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disk-size: 2048M
          script: ./android/scripts/run-connected-e2e.sh
      - name: Record Android UI test overview
        if: always()
        working-directory: .
        env:
          TEST_STATUS: ${{ steps.ui_tests.outcome == 'success' && 'passing' || 'failing' }}
          TEST_STARTED: ${{ steps.ui_timer.outputs.started }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TEST_DURATION_MS=$((($(date +%s) - TEST_STARTED) * 1000))
          KNOWN_TESTS=$(grep -R -h -E '^[[:space:]]*@Test' android/app/src/androidTest --include='*.kt' | wc -l | tr -d ' ')
          node scripts/test-overview.mjs record --id android-ui --suite "Android e2e" --status "$TEST_STATUS" --results-format junit --results android/app/build/outputs/androidTest-results --known-tests "$KNOWN_TESTS" --duration-ms "$TEST_DURATION_MS" --output test-overview/android-ui.json --recorded "$(date -u +%FT%TZ)" --run-url "$RUN_URL" --commit "$GITHUB_SHA"
      - name: Upload Android UI test overview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bookstr-test-overview-android-ui-${{ github.run_id }}
          path: test-overview/android-ui.json
      - name: Upload Android e2e screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bookstr-e2e-screenshots-android-${{ github.run_id }}
          path: android/e2e-screenshots/**/*.png
          if-no-files-found: error
      - name: Fail unsuccessful Android checks
        if: always() && (steps.android_build.outcome != 'success' || steps.ui_tests.outcome != 'success')
        run: exit 1

  release:
    name: Publish Android APK
    needs: android
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      BOOKSTR_KEYSTORE_FILE: ${{ github.workspace }}/bookstr-release.jks
      BOOKSTR_KEYSTORE_PASSWORD: ${{ secrets.BOOKSTR_KEYSTORE_PASSWORD }}
      BOOKSTR_KEY_ALIAS: ${{ secrets.BOOKSTR_KEY_ALIAS }}
      BOOKSTR_KEY_PASSWORD: ${{ secrets.BOOKSTR_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore release signing key
        env:
          BOOKSTR_KEYSTORE_BASE64: ${{ secrets.BOOKSTR_KEYSTORE_BASE64 }}
        run: |
          for variable in BOOKSTR_KEYSTORE_BASE64 BOOKSTR_KEYSTORE_PASSWORD BOOKSTR_KEY_ALIAS BOOKSTR_KEY_PASSWORD; do
            if [ -z "${!variable}" ]; then
              echo "Missing repository secret: $variable" >&2
              exit 1
            fi
          done
          umask 077
          printf '%s' "$BOOKSTR_KEYSTORE_BASE64" | base64 --decode > "$BOOKSTR_KEYSTORE_FILE"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install release build dependencies
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          sudo apt-get update && sudo apt-get install -y libboost-dev
      - name: Build signed release APK
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          version="0.0.3-ci.$RUN_NUMBER"
          # CI versions must exceed the existing timestamp-in-minutes version codes.
          code=$((1000000000 + RUN_NUMBER))
          cd android
          ./gradlew --no-daemon --no-configuration-cache --max-workers=2 assembleRelease "-Pbookstr.versionCode=$code" "-Pbookstr.versionName=$version"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          certificate=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test "$certificate" = c82e5af7122119c338db0af37cbf9efca1b6a0880e7b409f5537169fa6ffc477
          cp app/build/outputs/apk/release/app-release.apk "bookstr-$version.apk"
      - name: Publish Obtainium release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          version="0.0.3-ci.$RUN_NUMBER"
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            exit 0
          fi
          gh release create "$tag" "android/bookstr-$version.apk" \
            --target "$GITHUB_SHA" --title "Bookstr Android $version" --latest \
            --notes "Automatic Android build from $GITHUB_SHA. Add https://github.com/$GITHUB_REPOSITORY to Obtainium to receive updates."
      - name: Remove release signing key
        if: always()
        run: rm -f "$BOOKSTR_KEYSTORE_FILE"
