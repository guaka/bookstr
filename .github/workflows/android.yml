name: Android CI

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'shared/reader/**'
      - 'web/reader-speech.js'
      - 'web/reader-typography.js'
      - 'web/reader-chrome.js'
      - 'web/comic-reader.html'
      - 'web/vendor/libarchive.js'
      - 'web/vendor/libarchive.wasm'
      - 'shared/coverage/**'
      - 'scripts/coverage-ratchet.mjs'
      - 'scripts/test-overview.mjs'
      - '.github/workflows/android.yml'
      - 'scripts/workflows.test.mjs'
      - '.nvmrc'
  pull_request:
  workflow_dispatch:

env:
  BOOST_ROOT: ${{ github.workspace }}/.ci-boost
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPILERCHECK: content
  CCACHE_MAXSIZE: 1G

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Route Android checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      android: ${{ (github.event_name != 'pull_request' || steps.filter.outputs.android == 'true') && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - name: Filter Android paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad
        with:
          filters: |
            android:
              - 'android/**'
              - 'shared/reader/**'
              - 'web/reader-speech.js'
              - 'web/reader-typography.js'
              - 'web/reader-chrome.js'
              - 'web/comic-reader.html'
              - 'web/vendor/libarchive.js'
              - 'web/vendor/libarchive.wasm'
              - 'shared/coverage/**'
              - 'scripts/coverage-ratchet.mjs'
              - 'scripts/test-overview.mjs'
              - '.github/workflows/android.yml'
              - 'scripts/workflows.test.mjs'
              - '.nvmrc'

  unit-tests:
    name: Unit tests and coverage
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Test instrumentation result parser
        run: node --test --experimental-test-coverage --test-coverage-lines=100 --test-coverage-branches=100 --test-coverage-functions=100 android/scripts/instrumentation-results.test.mjs
      - name: Test Android release publisher
        run: node --test android/scripts/publish-obtainium-release.test.mjs
      - name: Test Android release version resolver
        run: node --test --experimental-test-coverage --test-coverage-lines=100 --test-coverage-branches=100 --test-coverage-functions=100 android/scripts/android-release-version.test.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Install isolated torrent build headers
        run: |
          sudo apt-get update && sudo apt-get install -y libboost-dev
          mkdir -p "$BOOST_ROOT/include"
          cp -R /usr/include/boost "$BOOST_ROOT/include/"
      - name: Test Android build configuration
        run: node --test --test-concurrency=1 android/scripts/build-configuration.test.mjs
      - name: Unit tests and JaCoCo
        id: unit_tests
        continue-on-error: true
        working-directory: android
        run: |
          started=$(date +%s)
          set +e
          ./gradlew --no-daemon --max-workers=2 testDebugUnitTest jacocoDebugUnitTestReport
          status=$?
          echo "duration_ms=$((($(date +%s) - started) * 1000))" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Record Android unit test overview
        if: always() && hashFiles('android/app/build/test-results/testDebugUnitTest/TEST-*.xml') != ''
        env:
          TEST_STATUS: ${{ steps.unit_tests.outcome == 'success' && 'passing' || 'failing' }}
          TEST_DURATION_MS: ${{ steps.unit_tests.outputs.duration_ms }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p test-overview
          coverage_xml="$(find android/app/build/reports/jacoco -name '*.xml' -print -quit 2>/dev/null || true)"
          KNOWN_TESTS=$(grep -R -h -E '^[[:space:]]*@Test' android/app/src/test --include='*.kt' | wc -l | tr -d ' ')
          node scripts/test-overview.mjs record --id android --suite Android --status "$TEST_STATUS" --results-format junit --results android/app/build/test-results/testDebugUnitTest --coverage-format jacoco --coverage "$coverage_xml" --known-tests "$KNOWN_TESTS" --duration-ms "$TEST_DURATION_MS" --output test-overview/android.json --recorded "$(date -u +%FT%TZ)" --run-url "$RUN_URL" --commit "$GITHUB_SHA"
      - name: Enforce Android coverage baseline
        if: always() && steps.unit_tests.outcome == 'success'
        run: node scripts/coverage-ratchet.mjs --suite android --report test-overview/android.json
      - name: Upload unit coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bookstr-android-unit-coverage-${{ github.sha }}
          path: android/app/build/reports/jacoco/
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true
      - name: Upload unit test overview
        if: always() && hashFiles('test-overview/android.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: bookstr-test-overview-android-${{ github.run_id }}
          path: test-overview/android.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Fail unsuccessful Android unit checks
        if: always() && steps.unit_tests.outcome != 'success'
        run: exit 1

  package-apks:
    name: Build debug app and test APKs
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Install isolated torrent build headers
        run: |
          sudo apt-get update && sudo apt-get install -y libboost-dev ccache
          mkdir -p "$BOOST_ROOT/include"
          cp -R /usr/include/boost "$BOOST_ROOT/include/"
      - name: Restore native compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-android-ccache-debug-x86_64-v1-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/app/build.gradle.kts', 'android/app/src/main/cpp/CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-android-ccache-debug-x86_64-v1-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/app/build.gradle.kts', 'android/app/src/main/cpp/CMakeLists.txt') }}-
      - name: Reset native cache statistics
        run: ccache --zero-stats
      - name: Build debug app APK
        working-directory: android
        run: ./gradlew --no-daemon --max-workers=2 assembleDebug -Pbookstr.abis=x86_64 -Pbookstr.cxxCompilerLauncher=ccache
      - name: Build instrumentation test APK
        working-directory: android
        run: ./gradlew --no-daemon --max-workers=2 assembleDebugAndroidTest -Pbookstr.abis=x86_64 -Pbookstr.cxxCompilerLauncher=ccache
      - name: Report native cache statistics
        if: always()
        run: ccache --show-stats
      - name: Stage prebuilt APKs
        run: |
          mkdir -p android/prebuilt-apks
          cp android/app/build/outputs/apk/debug/app-debug.apk android/prebuilt-apks/app-debug.apk
          cp android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk android/prebuilt-apks/app-debug-androidTest.apk
      - name: Upload prebuilt APKs
        uses: actions/upload-artifact@v4
        with:
          name: bookstr-android-apks-${{ github.sha }}
          path: android/prebuilt-apks/*.apk
          if-no-files-found: error
          retention-days: 14
          overwrite: true
          compression-level: 0

  emulator-tests:
    name: Emulator UI tests
    needs: package-apks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Download prebuilt APKs
        uses: actions/download-artifact@v4
        with:
          name: bookstr-android-apks-${{ github.sha }}
          path: android/prebuilt-apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start Android UI timer
        id: ui_timer
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Run UI tests against prebuilt APKs
        id: ui_tests
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disk-size: 2048M
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -memory 2048 -cores 2
          script: |
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            ./android/scripts/run-connected-e2e.sh --prebuilt android/prebuilt-apks/app-debug.apk android/prebuilt-apks/app-debug-androidTest.apk
      - name: Record Android UI test overview
        if: always() && hashFiles('android/e2e-results/instrumentation.started') != ''
        working-directory: .
        env:
          TEST_STATUS: ${{ steps.ui_tests.outcome == 'success' && 'passing' || 'failing' }}
          TEST_STARTED: ${{ steps.ui_timer.outputs.started }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p test-overview
          TEST_DURATION_MS=$((($(date +%s) - TEST_STARTED) * 1000))
          KNOWN_TESTS=$(grep -R -h -E '^[[:space:]]*@Test' android/app/src/androidTest --include='*.kt' | wc -l | tr -d ' ')
          node scripts/test-overview.mjs record --id android-ui --suite "Android e2e" --status "$TEST_STATUS" --results-format junit --results android/e2e-results --known-tests "$KNOWN_TESTS" --duration-ms "$TEST_DURATION_MS" --output test-overview/android-ui.json --recorded "$(date -u +%FT%TZ)" --run-url "$RUN_URL" --commit "$GITHUB_SHA"
      - name: Upload Android UI test overview
        if: always() && hashFiles('android/e2e-results/instrumentation.started') != ''
        uses: actions/upload-artifact@v4
        with:
          name: bookstr-test-overview-android-ui-${{ github.run_id }}
          path: test-overview/android-ui.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Upload Android e2e screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bookstr-e2e-screenshots-android-${{ github.run_id }}
          path: android/e2e-screenshots/**/*.png
          if-no-files-found: warn
          retention-days: 14
          overwrite: true
      - name: Upload Android UI results
        if: always() && hashFiles('android/e2e-results/instrumentation.started') != ''
        uses: actions/upload-artifact@v4
        with:
          name: bookstr-android-ui-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: android/e2e-results/
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Fail unsuccessful Android UI checks
        if: always() && steps.ui_tests.outcome != 'success'
        run: exit 1

  release:
    name: Publish Android APK
    needs: [unit-tests, package-apks, emulator-tests]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    env:
      BOOKSTR_KEYSTORE_FILE: ${{ github.workspace }}/bookstr-release.jks
      BOOKSTR_KEYSTORE_PASSWORD: ${{ secrets.BOOKSTR_KEYSTORE_PASSWORD }}
      BOOKSTR_KEY_ALIAS: ${{ secrets.BOOKSTR_KEY_ALIAS }}
      BOOKSTR_KEY_PASSWORD: ${{ secrets.BOOKSTR_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore release signing key
        env:
          BOOKSTR_KEYSTORE_BASE64: ${{ secrets.BOOKSTR_KEYSTORE_BASE64 }}
        run: |
          for variable in BOOKSTR_KEYSTORE_BASE64 BOOKSTR_KEYSTORE_PASSWORD BOOKSTR_KEY_ALIAS BOOKSTR_KEY_PASSWORD; do
            if [ -z "${!variable}" ]; then
              echo "Missing repository secret: $variable" >&2
              exit 1
            fi
          done
          umask 077
          printf '%s' "$BOOKSTR_KEYSTORE_BASE64" | base64 --decode > "$BOOKSTR_KEYSTORE_FILE"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install release build dependencies
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          sudo apt-get update && sudo apt-get install -y libboost-dev ccache
          mkdir -p "$BOOST_ROOT/include"
          cp -R /usr/include/boost "$BOOST_ROOT/include/"
      - name: Restore native compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-android-ccache-release-universal-v1-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/app/build.gradle.kts', 'android/app/src/main/cpp/CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-android-ccache-release-universal-v1-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/app/build.gradle.kts', 'android/app/src/main/cpp/CMakeLists.txt') }}-
      - name: Reset native cache statistics
        run: ccache --zero-stats
      - name: Resolve release version
        id: release_version
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # The workflow run's creation time is stable if GitHub reruns an attempt.
          export RUN_STARTED_AT="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .created_at)"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '[.[] | select(.draft == false and .prerelease == false) | {tag_name, body}]' \
            | jq -s 'add // []' > "$RUNNER_TEMP/android-releases.json"
          version="$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { resolveAndroidReleaseVersion } from "./android/scripts/android-release-version.mjs";
            const releases = JSON.parse(readFileSync(0, "utf8"));
            process.stdout.write(resolveAndroidReleaseVersion({
              runStartedAt: process.env.RUN_STARTED_AT,
              runNumber: process.env.RUN_NUMBER,
              runId: process.env.RUN_ID,
              releases,
            }));
          ' < "$RUNNER_TEMP/android-releases.json")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build signed release APK
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          : "${RELEASE_VERSION:?Release version resolution failed}"
          version="$RELEASE_VERSION"
          code=$((1000000000 + RUN_NUMBER))
          cd android
          ./gradlew --no-daemon --no-configuration-cache --max-workers=2 assembleRelease -Pbookstr.cxxCompilerLauncher=ccache "-Pbookstr.versionCode=$code" "-Pbookstr.versionName=$version"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          certificate=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test "$certificate" = c82e5af7122119c338db0af37cbf9efca1b6a0880e7b409f5537169fa6ffc477
          cp app/build/outputs/apk/release/app-release.apk "bookstr-$version.apk"
      - name: Report native cache statistics
        if: always()
        run: ccache --show-stats
      - name: Publish Obtainium release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
        run: bash android/scripts/publish-obtainium-release.sh
      - name: Remove release signing key
        if: always()
        run: rm -f "$BOOKSTR_KEYSTORE_FILE"
