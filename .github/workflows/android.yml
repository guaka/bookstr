name: Android CI

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'shared/reader/**'
      - 'web/reader-speech.js'
      - 'web/reader-typography.js'
      - 'web/reader-chrome.js'
      - 'web/comic-reader.html'
      - 'web/vendor/libarchive.js'
      - 'web/vendor/libarchive.wasm'
      - 'shared/coverage/**'
      - 'scripts/coverage-ratchet.mjs'
      - 'scripts/test-overview.mjs'
      - '.github/workflows/android.yml'
      - 'scripts/workflows.test.mts'
      - '.nvmrc'
  pull_request:
  workflow_dispatch:

env:
  BOOST_ROOT: ${{ github.workspace }}/.ci-boost
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPILERCHECK: content
  CCACHE_MAXSIZE: 1G

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Route Android checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      android: ${{ (github.event_name != 'pull_request' || steps.filter.outputs.android_code == 'true' || steps.baseline.outputs.android == 'true') && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - name: Filter Android paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad
        with:
          filters: |
            android_code:
              - 'android/**'
              - 'shared/reader/**'
              - 'web/reader-speech.js'
              - 'web/reader-typography.js'
              - 'web/reader-chrome.js'
              - 'web/comic-reader.html'
              - 'web/vendor/libarchive.js'
              - 'web/vendor/libarchive.wasm'
              - 'scripts/coverage-ratchet.mjs'
              - 'scripts/test-overview.mjs'
              - 'scripts/workflows.test.mts'
              - '.nvmrc'
      - name: Compare Android coverage floor with pull request base
        id: baseline
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if ! git fetch --no-tags --depth=1 origin "$PR_BASE_SHA"; then
            echo 'android=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git show "$PR_BASE_SHA:shared/coverage/baselines-v1.json" > "$RUNNER_TEMP/base-baselines.json"; then
            echo 'android=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git show "$PR_BASE_SHA:.github/workflows/android.yml" > "$RUNNER_TEMP/base-android.yml"; then
            echo 'android=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          result=$(node scripts/platform-baseline-routing-cli.mjs --suite android --base "$RUNNER_TEMP/base-baselines.json" --head shared/coverage/baselines-v1.json --workflow-base "$RUNNER_TEMP/base-android.yml" --workflow-head .github/workflows/android.yml)
          echo "android=$result" >> "$GITHUB_OUTPUT"

  unit-tests:
    name: Unit tests and coverage
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Use commit timestamp for generated Android constants
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Test instrumentation result parser
        run: node --test --experimental-test-coverage --test-coverage-lines=100 --test-coverage-branches=100 --test-coverage-functions=100 android/scripts/instrumentation-results.test.mts scripts/junit.test.mts android/scripts/ci-instrumentation.test.mts
      - name: Test Android release publisher
        run: node --test android/scripts/publish-obtainium-release.test.mts
      - name: Test Android release version resolver
        run: node --test --experimental-test-coverage --test-coverage-lines=100 --test-coverage-branches=100 --test-coverage-functions=100 android/scripts/android-release-version.test.mts
      - name: Test connected Android runner
        run: node --test android/scripts/run-connected-e2e.test.mts android/scripts/combine-shard-coverage.test.mts
      - name: Test native coverage tooling
        run: |
          node --test --experimental-test-coverage --test-coverage-lines=100 --test-coverage-branches=100 --test-coverage-functions=100 android/scripts/native-coverage.test.mts
          bash android/scripts/test-prepare-native-coverage.sh
          bash android/scripts/test-collect-native-coverage.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Test Android build configuration
        run: node --test --test-concurrency=1 android/scripts/build-configuration.test.mts
      - name: Unit tests and JaCoCo
        id: unit_tests
        continue-on-error: true
        working-directory: android
        run: |
          started=$(date +%s)
          set +e
          ./gradlew --daemon --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8' testDebugUnitTest jacocoDebugUnitTestReport
          status=$?
          echo "duration_ms=$((($(date +%s) - started) * 1000))" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Record Android unit test overview
        if: always() && hashFiles('android/app/build/test-results/testDebugUnitTest/TEST-*.xml') != ''
        env:
          TEST_STATUS: ${{ steps.unit_tests.outcome == 'success' && 'passing' || 'failing' }}
          TEST_DURATION_MS: ${{ steps.unit_tests.outputs.duration_ms }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p test-overview
          coverage_xml="$(find android/app/build/reports/jacoco -name '*.xml' -print -quit 2>/dev/null || true)"
          KNOWN_TESTS=$(grep -R -h -E '^[[:space:]]*@Test' android/app/src/test --include='*.kt' | wc -l | tr -d ' ')
          node scripts/test-overview.mjs record --id android --suite Android --status "$TEST_STATUS" --results-format junit --results android/app/build/test-results/testDebugUnitTest --coverage-format jacoco --coverage "$coverage_xml" --known-tests "$KNOWN_TESTS" --duration-ms "$TEST_DURATION_MS" --output test-overview/android.json --recorded "$(date -u +%FT%TZ)" --run-url "$RUN_URL" --commit "$GITHUB_SHA"
      - name: Enforce Android coverage baseline
        if: always() && steps.unit_tests.outcome == 'success'
        run: node scripts/coverage-ratchet.mjs --suite android --report test-overview/android.json
      - name: Upload failed JVM test reports
        if: always() && steps.unit_tests.outcome == 'failure' && hashFiles('android/app/build/test-results/testDebugUnitTest/TEST-*.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: bookstr-android-unit-failures-${{ github.run_id }}-${{ github.run_attempt }}
          path: android/app/build/test-results/testDebugUnitTest/TEST-*.xml
          retention-days: 7
          overwrite: true
      - name: Upload unit coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bookstr-android-unit-coverage-${{ github.sha }}
          path: android/app/build/reports/jacoco/
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true
      - name: Upload JVM JaCoCo execution data
        if: always() && hashFiles('android/app/build/outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec') != ''
        uses: actions/upload-artifact@v4
        with:
          name: bookstr-android-jvm-exec-${{ github.sha }}
          path: android/app/build/outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Upload unit test overview
        if: always() && hashFiles('test-overview/android.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: bookstr-test-overview-android-${{ github.run_id }}
          path: test-overview/android.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Fail unsuccessful Android unit checks
        if: always() && steps.unit_tests.outcome != 'success'
        run: exit 1

  package-apks:
    name: Build debug app and test APKs
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Use commit timestamp for generated Android constants
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Install isolated torrent build headers
        run: |
          sudo apt-get update && sudo apt-get install -y libboost-dev ccache
          mkdir -p "$BOOST_ROOT/include"
          cp -R /usr/include/boost "$BOOST_ROOT/include/"
      - name: Restore native compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-android-ccache-debug-x86_64-v1-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/app/build.gradle.kts', 'android/app/src/main/cpp/CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-android-ccache-debug-x86_64-v1-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/app/build.gradle.kts', 'android/app/src/main/cpp/CMakeLists.txt') }}-
      - name: Reset native cache statistics
        run: ccache --zero-stats
      - name: Build debug app and instrumentation APKs
        working-directory: android
        run: ./gradlew --daemon --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8' assembleDebug assembleDebugAndroidTest -Pbookstr.abis=x86_64 -Pbookstr.cxxCompilerLauncher=ccache -Pbookstr.nativeCoverage=true
      - name: Stage compiled project classes for full coverage
        working-directory: android
        run: ./gradlew --no-daemon --max-workers=2 stageDebugManagedCoverageClasses -Pbookstr.abis=x86_64 -Pbookstr.cxxCompilerLauncher=ccache -Pbookstr.nativeCoverage=true
      - name: Stage matching native coverage inputs
        run: |
          set -euo pipefail
          input_dir=android/native-coverage-input
          ndk_bin="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p "$input_dir/bin"
          mapfile -t objects < <(find android/app/build/intermediates/cxx/Debug -type f -path '*/obj/x86_64/libbookstr_torrent.so' -print)
          if [ "${#objects[@]}" -ne 1 ]; then
            echo "Expected one unstripped x86_64 JNI library, found ${#objects[@]}" >&2
            printf '%s\n' "${objects[@]}" >&2
            exit 1
          fi
          cp "${objects[0]}" "$input_dir/libbookstr_torrent.so"
          cp "$ndk_bin/llvm-cov" "$ndk_bin/llvm-profdata" "$input_dir/bin/"
          mkdir -p "$input_dir/lib"
          for tool in llvm-cov llvm-profdata; do
            while IFS= read -r dependency; do
              case "$dependency" in
                "$ANDROID_HOME/ndk/27.2.12479018"/*) cp "$dependency" "$input_dir/lib/" ;;
              esac
            done < <(ldd "$ndk_bin/$tool" | awk '$2 == "=>" && $3 ~ /^\// {print $3} $1 ~ /^\// {print $1}')
          done
          printf '%s\n' "$GITHUB_WORKSPACE/android/app/src/main/cpp" > "$input_dir/compiled-source-dir.txt"
      - name: Report native cache statistics
        if: always()
        run: ccache --show-stats
      - name: Stage prebuilt APKs
        run: |
          mkdir -p android/prebuilt-apks
          cp android/app/build/outputs/apk/debug/app-debug.apk android/prebuilt-apks/app-debug.apk
          cp android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk android/prebuilt-apks/app-debug-androidTest.apk
      - name: Upload prebuilt APKs
        uses: actions/upload-artifact@v4
        with:
          name: bookstr-android-apks-${{ github.sha }}
          path: android/prebuilt-apks/*.apk
          if-no-files-found: error
          retention-days: 14
          overwrite: true
          compression-level: 0
      - name: Upload compiled project classes
        uses: actions/upload-artifact@v4
        with:
          name: bookstr-android-project-classes-${{ github.sha }}
          path: android/app/build/coverage/project-classes/
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Upload native coverage inputs
        uses: actions/upload-artifact@v4
        with:
          name: bookstr-android-native-coverage-inputs-${{ github.sha }}
          path: android/native-coverage-input/
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  emulator-shards:
    name: Android emulator shard ${{ matrix.shard }}
    needs: package-apks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Download prebuilt APKs
        uses: actions/download-artifact@v4
        with:
          name: bookstr-android-apks-${{ github.sha }}
          path: android/prebuilt-apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run UI tests against prebuilt APKs
        id: ui_tests
        continue-on-error: true
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        env:
          BOOKSTR_SHARD_TIMINGS: android/scripts/shard-timings.json
          BOOKSTR_SHARD_COUNT: 4
          BOOKSTR_SHARD_INDEX: ${{ matrix.shard }}
          BOOKSTR_COVERAGE_FILE: android/app/build/coverage/shard-${{ matrix.shard }}/full.ec
          BOOKSTR_NATIVE_PROFILE_OUTPUT: android/app/build/coverage/shard-${{ matrix.shard }}/native
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disk-size: 2048M
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -memory 2048 -cores 2
          script: |
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            ./android/scripts/run-connected-e2e.sh --prebuilt android/prebuilt-apks/app-debug.apk android/prebuilt-apks/app-debug-androidTest.apk
      - name: Retry emulator boot or APK setup
        id: ui_retry
        if: steps.ui_tests.outcome == 'failure' && hashFiles(format('android/e2e-results/shard-{0}/instrumentation.started', matrix.shard)) == ''
        continue-on-error: true
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        env:
          BOOKSTR_SHARD_TIMINGS: android/scripts/shard-timings.json
          BOOKSTR_SHARD_COUNT: 4
          BOOKSTR_SHARD_INDEX: ${{ matrix.shard }}
          BOOKSTR_COVERAGE_FILE: android/app/build/coverage/shard-${{ matrix.shard }}/full.ec
          BOOKSTR_NATIVE_PROFILE_OUTPUT: android/app/build/coverage/shard-${{ matrix.shard }}/native
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disk-size: 2048M
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -memory 2048 -cores 2
          script: |
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            ./android/scripts/run-connected-e2e.sh --prebuilt android/prebuilt-apks/app-debug.apk android/prebuilt-apks/app-debug-androidTest.apk
      - name: Upload shard results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bookstr-android-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            android/app/build/coverage/shard-${{ matrix.shard }}/
            android/e2e-results/shard-${{ matrix.shard }}/
            android/e2e-screenshots/shard-${{ matrix.shard }}/
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Fail unsuccessful Android shard
        if: always() && steps.ui_tests.outcome != 'success' && steps.ui_retry.outcome != 'success'
        run: exit 1

  emulator-tests:
    name: Emulator UI tests
    needs: [changes, unit-tests, package-apks, emulator-shards]
    if: always() && needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Download shard results and coverage
        uses: actions/download-artifact@v4
        with:
          pattern: bookstr-android-shard-*-${{ github.run_id }}
          merge-multiple: true
          path: android
      - name: Combine every shard's execution data
        run: bash android/scripts/combine-shard-coverage.sh 4
      - name: Download JVM JaCoCo execution data
        uses: actions/download-artifact@v4
        with:
          name: bookstr-android-jvm-exec-${{ github.sha }}
          path: android/app/build/outputs/unit_test_code_coverage/debugUnitTest
      - name: Download compiled project classes
        uses: actions/download-artifact@v4
        with:
          name: bookstr-android-project-classes-${{ github.sha }}
          path: android/app/build/coverage/project-classes
      - name: Download native coverage inputs
        uses: actions/download-artifact@v4
        with:
          name: bookstr-android-native-coverage-inputs-${{ github.sha }}
          path: android/native-coverage-input
      - name: Generate native source coverage report
        if: always() && hashFiles('android/app/build/coverage/shard-*/native/raw/**/*.profraw') != ''
        id: native_coverage
        run: |
          set -euo pipefail
          chmod +x android/native-coverage-input/bin/llvm-cov android/native-coverage-input/bin/llvm-profdata
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/android/native-coverage-input/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          ./android/scripts/native-coverage.mjs \
            --profile-dir android/app/build/coverage \
            --object android/native-coverage-input/libbookstr_torrent.so \
            --ndk-bin android/native-coverage-input/bin \
            --compiled-source-dir "$(cat android/native-coverage-input/compiled-source-dir.txt)" \
            --repo-root "$GITHUB_WORKSPACE" \
            --output-dir android/app/build/reports/native-coverage
      - name: Upload native source coverage report
        if: always() && hashFiles('android/app/build/reports/native-coverage/native-coverage.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: bookstr-android-native-coverage-${{ github.sha }}
          path: |
            android/app/build/reports/native-coverage/
            android/app/build/coverage/shard-*/native/raw/
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Fail missing native source coverage report
        if: always() && steps.native_coverage.outcome != 'success'
        run: exit 1
      - name: Set up Java for coverage reporting
        if: always()
        id: coverage_java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle for coverage reporting
        if: always()
        id: coverage_gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Install Android platform for coverage reporting
        if: always()
        id: coverage_sdk
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Generate full managed JaCoCo report
        if: always() && steps.coverage_java.outcome == 'success' && steps.coverage_gradle.outcome == 'success' && steps.coverage_sdk.outcome == 'success'
        id: full_coverage
        working-directory: android
        run: ./gradlew --no-daemon --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8' jacocoManagedFullDebugReport
      - name: Upload full managed JaCoCo report
        if: always() && hashFiles('android/app/build/reports/jacoco/jacocoManagedFullDebugReport/jacocoManagedFullDebugReport.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: bookstr-android-full-managed-coverage-${{ github.sha }}
          path: android/app/build/reports/jacoco/jacocoManagedFullDebugReport/
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Fail missing full managed coverage report
        if: always() && steps.full_coverage.outcome != 'success'
        run: exit 1
      - name: Record Android UI test overview
        if: always() && hashFiles('android/e2e-results/shard-*/instrumentation.started') != ''
        working-directory: .
        env:
          TEST_STATUS: ${{ needs.emulator-shards.result == 'success' && 'passing' || 'failing' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p test-overview
          KNOWN_TESTS=$(grep -R -h -E '^[[:space:]]*@Test' android/app/src/androidTest --include='*.kt' | wc -l | tr -d ' ')
          node scripts/test-overview.mjs record --id android-ui --suite "Android e2e" --status "$TEST_STATUS" --results-format junit --results android/e2e-results --known-tests "$KNOWN_TESTS" --output test-overview/android-ui.json --recorded "$(date -u +%FT%TZ)" --run-url "$RUN_URL" --commit "$GITHUB_SHA"
      - name: Upload Android UI test overview
        if: always() && hashFiles('android/e2e-results/shard-*/instrumentation.started') != ''
        uses: actions/upload-artifact@v4
        with:
          name: bookstr-test-overview-android-ui-${{ github.run_id }}
          path: test-overview/android-ui.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Upload Android e2e screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bookstr-e2e-screenshots-android-${{ github.run_id }}
          path: android/e2e-screenshots/**/*.png
          if-no-files-found: warn
          retention-days: 14
          overwrite: true
      - name: Upload Android UI results
        if: always() && hashFiles('android/e2e-results/shard-*/instrumentation.started') != ''
        uses: actions/upload-artifact@v4
        with:
          name: bookstr-android-ui-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: android/e2e-results/
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Fail unsuccessful Android UI checks
        if: always() && (needs.emulator-shards.result != 'success' || needs.unit-tests.result != 'success' || needs.package-apks.result != 'success')
        run: exit 1

  release:
    name: Publish Android APK
    needs: [unit-tests, package-apks, emulator-tests]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    env:
      BOOKSTR_KEYSTORE_FILE: ${{ github.workspace }}/bookstr-release.jks
      BOOKSTR_KEYSTORE_PASSWORD: ${{ secrets.BOOKSTR_KEYSTORE_PASSWORD }}
      BOOKSTR_KEY_ALIAS: ${{ secrets.BOOKSTR_KEY_ALIAS }}
      BOOKSTR_KEY_PASSWORD: ${{ secrets.BOOKSTR_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore release signing key
        env:
          BOOKSTR_KEYSTORE_BASE64: ${{ secrets.BOOKSTR_KEYSTORE_BASE64 }}
        run: |
          for variable in BOOKSTR_KEYSTORE_BASE64 BOOKSTR_KEYSTORE_PASSWORD BOOKSTR_KEY_ALIAS BOOKSTR_KEY_PASSWORD; do
            if [ -z "${!variable}" ]; then
              echo "Missing repository secret: $variable" >&2
              exit 1
            fi
          done
          umask 077
          printf '%s' "$BOOKSTR_KEYSTORE_BASE64" | base64 --decode > "$BOOKSTR_KEYSTORE_FILE"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install release build dependencies
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          sudo apt-get update && sudo apt-get install -y libboost-dev ccache
          mkdir -p "$BOOST_ROOT/include"
          cp -R /usr/include/boost "$BOOST_ROOT/include/"
      - name: Restore native compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-android-ccache-release-universal-v1-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/app/build.gradle.kts', 'android/app/src/main/cpp/CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-android-ccache-release-universal-v1-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/app/build.gradle.kts', 'android/app/src/main/cpp/CMakeLists.txt') }}-
      - name: Reset native cache statistics
        run: ccache --zero-stats
      - name: Resolve release version
        id: release_version
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # The workflow run's creation time is stable if GitHub reruns an attempt.
          export RUN_STARTED_AT="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .created_at)"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '[.[] | {tag_name, body}]' \
            | jq -s 'add // []' > "$RUNNER_TEMP/android-releases.json"
          version="$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { resolveAndroidReleaseVersion } from "./android/scripts/android-release-version.mjs";
            const releases = JSON.parse(readFileSync(0, "utf8"));
            process.stdout.write(resolveAndroidReleaseVersion({
              runStartedAt: process.env.RUN_STARTED_AT,
              runNumber: process.env.RUN_NUMBER,
              runId: process.env.RUN_ID,
              releases,
            }));
          ' < "$RUNNER_TEMP/android-releases.json")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build signed release APK
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          : "${RELEASE_VERSION:?Release version resolution failed}"
          version="$RELEASE_VERSION"
          code=$((1000000000 + RUN_NUMBER))
          cd android
          ./gradlew --no-daemon --no-configuration-cache --max-workers=2 assembleRelease -Pbookstr.cxxCompilerLauncher=ccache "-Pbookstr.versionCode=$code" "-Pbookstr.versionName=$version"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          certificate=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test "$certificate" = c82e5af7122119c338db0af37cbf9efca1b6a0880e7b409f5537169fa6ffc477
          cp app/build/outputs/apk/release/app-release.apk "bookstr-$version.apk"
      - name: Report native cache statistics
        if: always()
        run: ccache --show-stats
      - name: Publish Obtainium release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
        run: bash android/scripts/publish-obtainium-release.sh
      - name: Remove release signing key
        if: always()
        run: rm -f "$BOOKSTR_KEYSTORE_FILE"
