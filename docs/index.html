<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#173b36" />
    <title>Bookstr Documentation</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" />
    <style>
      :root {
        --theme-color: #b85c38;
        --link-color: #9c4327;
      }

      body {
        color: #1f2926;
        background: #f7f2e9;
      }

      .sidebar {
        background: #173b36;
        color: #f7f2e9;
        padding-top: 1.5rem;
      }

      .sidebar a,
      .sidebar li.collapse .app-sub-sidebar a {
        color: #e7ddc9;
        font-size: 0.95rem;
        line-height: 1.35;
      }

      .sidebar li.active > a,
      .sidebar a:hover {
        color: #ffbf69;
      }

      .sidebar li.active > a {
        background: rgba(255, 191, 105, 0.13);
        border-left: 3px solid #ffbf69;
        font-weight: 700;
        margin-left: -1rem;
        padding-left: calc(1rem - 3px);
      }

      .sidebar-nav > ul > li {
        margin: 0.25rem 0;
      }

      .sidebar-nav > ul > li > a {
        display: block;
        padding: 0.55rem 1rem;
      }

      .app-name-link,
      .app-name-link:visited {
        color: #ffffff;
        font-size: 1.35rem;
        font-weight: 800;
        letter-spacing: 0.01em;
      }

      .markdown-section {
        max-width: 900px;
      }

      .markdown-section h1,
      .markdown-section h2,
      .markdown-section h3 {
        color: #173b36;
      }

      .markdown-section code {
        color: #9c4327;
      }
    </style>
  </head>
  <body>
    <div id="app">Loading documentation...</div>
    <script>
      window.$docsify = {
        name: "Bookstr",
        repo: "https://github.com/guaka/bookstr",
        basePath: "/docs/",
        homepage: "README.md",
        loadSidebar: true,
        relativePath: true,
        auto2top: true,
        subMaxLevel: 2
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  </body>
</html>
