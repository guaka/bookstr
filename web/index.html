<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="shortcut icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f7f3ea" />
    <title>bookstr reader</title>
    <style>
      :root {
        color-scheme: light;
      }
      body.theme-white {
        --page-bg: #f7f3ea;
        --page-text: #222;
        --note-text: #666;
        --muted-text: #5f6368;
        --card-bg: #fff;
        --card-border: #ddd;
        --card-shadow: rgba(0, 0, 0, 0.06);
        --badge-bg: #f7f7f7;
        --badge-border: #ddd;
        --badge-text: #374151;
        --result-title: #111827;
        --settings-bg: #faf9f5;
        --settings-border: #ddd;
        --btn-bg: #111827;
        --btn-text: #fff;
        --btn-border: #111827;
        --chip-bg: #fafafa;
        --chip-border: #d4d4d4;
        --chip-text: #111827;
        --backdrop: rgba(17, 24, 39, 0.45);
      }
      body.theme-paper {
        --page-bg: #f7ecde;
        --page-text: #2f271e;
        --note-text: #5f574f;
        --muted-text: #645e56;
        --card-bg: #fffaf4;
        --card-border: #dcc8b0;
        --card-shadow: rgba(70, 46, 22, 0.09);
        --badge-bg: #efe2d2;
        --badge-border: #d8c3ad;
        --badge-text: #43372b;
        --result-title: #221c14;
        --settings-bg: #fff7ee;
        --settings-border: #e2cdb2;
        --btn-bg: #3d2b1b;
        --btn-text: #fff;
        --btn-border: #3d2b1b;
        --chip-bg: #efe4d6;
        --chip-border: #d4c0a6;
        --chip-text: #3a2d1f;
        --backdrop: rgba(56, 38, 18, 0.45);
      }
      body.theme-dark {
        color-scheme: dark;
        --page-bg: #101827;
        --page-text: #e5e7eb;
        --note-text: #9ca3af;
        --muted-text: #9ca3af;
        --card-bg: #1f2937;
        --card-border: #374151;
        --card-shadow: rgba(0, 0, 0, 0.45);
        --badge-bg: #111827;
        --badge-border: #374151;
        --badge-text: #e5e7eb;
        --result-title: #e5e7eb;
        --settings-bg: #111827;
        --settings-border: #374151;
        --btn-bg: #f9fafb;
        --btn-text: #111827;
        --btn-border: #f9fafb;
        --chip-bg: #374151;
        --chip-border: #4b5563;
        --chip-text: #e5e7eb;
        --backdrop: rgba(3, 7, 18, 0.55);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--page-bg, #f7f3ea);
        color: var(--page-text, #222);
        font: 14px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .wrap {
        max-width: 100%;
        margin: 0 auto;
        padding: 0.75rem;
        display: grid;
        gap: 0.7rem;
      }
      .card {
        background: var(--card-bg, #fff);
        border: 1px solid var(--card-border, #ddd);
        border-radius: 14px;
        padding: 0.72rem;
        box-shadow: 0 1px 18px var(--card-shadow, rgba(0, 0, 0, 0.06));
      }
      h1 {
        margin: 0 0 0.35rem;
        font-size: 1.2rem;
      }
      .app-header {
        display: flex;
        justify-content: space-between;
        gap: 0.75rem;
        align-items: center;
        padding: 0.18rem 0.25rem 0.2rem;
      }
      .app-header-left {
        display: grid;
        gap: 0.12rem;
      }
      .app-header-right {
        display: flex;
        gap: 0.45rem;
        align-items: center;
        min-width: 0;
        margin-left: auto;
      }
      .app-title {
        margin: 0;
        font-size: 1.2rem;
      }
      .npub-info {
        margin: 0;
        color: var(--muted-text, #666);
        font-size: 0.72rem;
        text-align: right;
      }
      .npub-pill {
        display: block;
        border-radius: 999px;
        border: 1px solid var(--badge-border, #ddd);
        padding: 0.24rem 0.52rem;
        color: var(--page-text, #222);
        background: color-mix(in srgb, var(--card-bg, #fff) 88%, transparent);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.68rem;
        white-space: nowrap;
        max-width: min(62vw, 38rem);
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #settings-btn {
        width: 2.55rem;
        height: 2.55rem;
        padding: 0;
        flex: 0 0 auto;
        font-size: 1.45rem;
        line-height: 1;
      }
      .page-header {
        display: flex;
        justify-content: space-between;
        gap: 0.8rem;
        align-items: center;
      }
      .row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 0.45rem;
      }
      .row-3 {
        grid-template-columns: minmax(0, 1fr) minmax(130px, 220px) auto;
        gap: 0.45rem;
      }
      .results {
        display: grid;
        gap: 0.42rem;
        max-height: 56vh;
        overflow: auto;
        padding-right: 0.25rem;
      }
      .result-item {
        border: 1px solid #e5e5e5;
        border-radius: 0.8rem;
        padding: 0.6rem;
        display: grid;
        gap: 0.42rem;
      }
      .result-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 0.55rem;
      }
      .result-title {
        font-size: 1rem;
        font-weight: 650;
        color: var(--result-title, #111827);
      }
      .result-meta {
        margin: 0;
        color: var(--muted-text, #5f6368);
      }
      .result-tags {
        display: flex;
        gap: 0.4rem;
        flex-wrap: wrap;
      }
      .badge {
        border: 1px solid var(--badge-border, #ddd);
        border-radius: 0.5rem;
        padding: 0.06rem 0.45rem;
        font-size: 0.78rem;
        background: var(--badge-bg, #f7f7f7);
        color: var(--badge-text, #374151);
      }
      input,
      select,
      button {
        font: inherit;
        border: 1px solid var(--badge-border, #c8c8c8);
        border-radius: 0.6rem;
        padding: 0.6rem 0.75rem;
        background: var(--card-bg, #fff);
        color: var(--page-text, #222);
      }
      input {
        min-width: 0;
      }
      button {
        cursor: pointer;
        background: var(--btn-bg, #111827);
        color: var(--btn-text, #fff);
        border-color: var(--btn-border, #111827);
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .note {
        color: var(--note-text, #666);
        margin-top: 0.22rem;
      }
      .row-actions {
        display: flex;
        gap: 0.25rem;
        align-items: center;
      }
      .icon-btn {
        border: 1px solid var(--badge-border, #c8c8c8);
        border-radius: 999px;
        background: var(--card-bg, #fff);
        color: var(--page-text, #222);
        padding: 0.25rem 0.58rem;
        cursor: pointer;
      }
      .icon-btn:hover {
        background: var(--badge-bg, #f3f4f6);
      }
      .chip-btn {
        border-radius: 0.7rem;
        background: var(--chip-bg, #fafafa);
        color: var(--chip-text, #111827);
        border-color: var(--chip-border, #d4d4d4);
        cursor: pointer;
      }
      .chip-btn[aria-pressed="true"] {
        background: var(--btn-bg, #111827);
        color: var(--btn-text, #fff);
      }
      .library-columns {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 0.85rem;
      }
      .library-column h3 {
        margin: 0 0 0.45rem;
        font-size: 1rem;
        color: var(--result-title, #111827);
      }
      .sublist {
        margin: 0;
        padding-left: 1.05rem;
      }
      .sublist li {
        margin: 0.24rem 0;
        font-size: 0.93rem;
        word-break: break-word;
      }
      .meta-list {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        margin-top: 0.45rem;
      }
      .meta-list .badge {
        background: var(--badge-bg, #f7f7f7);
        border-color: var(--badge-border, #ddd);
        color: var(--badge-text, #374151);
      }
      .meta-note {
        color: var(--muted-text, #6b7280);
        margin-top: 0.45rem;
      }
      .viewer {
        min-height: 65vh;
        border: 1px dashed #b8b8b8;
        border-radius: 12px;
        overflow: hidden;
        background: var(--card-bg, #fff);
      }
      .viewer iframe {
        width: 100%;
        height: 65vh;
        border: 0;
      }
      .hidden {
        display: none;
      }
      .settings-modal {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0.85rem;
        z-index: 20;
      }
      .settings-modal.hidden {
        display: none;
      }
      .settings-backdrop {
        position: absolute;
        inset: 0;
        background: var(--backdrop, rgba(17, 24, 39, 0.45));
      }
      .settings-panel {
        border: 1px solid var(--settings-border, #ddd);
        border-radius: 10px;
        padding: 0.6rem;
        background: var(--settings-bg, #faf9f5);
        position: relative;
        z-index: 21;
        width: min(680px, 100%);
        max-height: calc(100vh - 1.7rem);
        overflow: auto;
      }
      .settings-panel h2 {
        margin: 0 0 0.42rem;
        font-size: 1rem;
      }
      .settings-close {
        border-radius: 0.45rem;
        padding: 0.25rem 0.55rem;
        margin-left: auto;
        background: var(--card-bg, #fff);
        color: var(--page-text, #111827);
      }
      .footer {
        text-align: right;
        font-size: 0.68rem;
        color: color-mix(in srgb, var(--note-text, #666) 70%, transparent);
        margin-top: -0.15rem;
      }
      .footer a { color: var(--note-text, #666); font-weight: 600; }
      .footer-note { margin: 0.4rem 0 0; }
      .github-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--note-text, #666);
      }
      .github-link svg {
        width: 1rem;
        height: 1rem;
        fill: currentColor;
      }
      .settings-row {
        display: flex;
        gap: 0.4rem;
        align-items: center;
        flex-wrap: wrap;
      }
    </style>
  </head>
    <body class="theme-white">
    <main class="wrap">
      <header class="app-header">
        <div class="app-header-left">
          <h1 class="app-title">bookstr reader</h1>
        </div>
        <div class="app-header-right">
          <p class="npub-info"><span id="npub-display" class="npub-pill">not connected</span></p>
          <button id="settings-btn" class="icon-btn" aria-label="Settings" aria-pressed="false" title="Settings">⚙</button>
        </div>
      </header>

      <section class="card">
        <p id="status" class="note">Search books by title, author, ISBN or publisher and open one.</p>
        <form id="search-form" class="row-3" autocomplete="off">
          <input id="query-input" placeholder="Search title, author, ISBN, publisher" aria-label="Book search query" autofocus />
          <select id="search-type" aria-label="Search type">
            <option value="all">All fields</option>
            <option value="title">Title</option>
            <option value="author">Author</option>
            <option value="isbn">ISBN</option>
            <option value="publisher">Publisher</option>
          </select>
          <button id="search-btn" type="submit">Search</button>
        </form>
        <div id="results" class="results" aria-live="polite"></div>
      </section>

      <section class="card">
        <div class="library-columns">
          <div class="library-column">
            <h3>Nostr favorites</h3>
            <ul id="favorites-list" class="sublist"></ul>
            <p class="meta-note">Click a title to open. Favoriting is local in your browser for now.</p>
          </div>
          <div class="library-column">
            <h3>Reading library</h3>
            <ul id="reading-list" class="sublist"></ul>
            <p class="meta-note">Books opened from search get added here (optionally).</p>
          </div>
          <div class="library-column">
            <h3>Words</h3>
            <div id="words-list" class="meta-list"></div>
          </div>
        </div>
      </section>

      <section class="card viewer">
        <iframe id="reader-frame" title="Reader" allow="fullscreen"></iframe>
      </section>

    <section class="footer">
      <div
        id="settings-modal"
        class="settings-modal hidden"
        role="dialog"
        aria-modal="true"
        aria-hidden="true"
        aria-labelledby="settings-title"
      >
        <div id="settings-backdrop" class="settings-backdrop"></div>
        <section id="settings-panel" class="settings-panel">
          <div class="row-actions" style="justify-content: flex-end; margin-bottom: 0.4rem;">
            <button id="settings-close" type="button" class="icon-btn" aria-label="Close settings">✕</button>
          </div>
          <h2 id="settings-title">Settings</h2>
          <label class="settings-row">
            <input id="auto-reading" type="checkbox" checked />
            <span>Auto-add opened books to reading library</span>
          </label>
          <label class="settings-row" style="margin-top: .5rem;">
            <input id="nip7-enabled" type="checkbox" checked />
            <span>Auto-use NIP-07 when available</span>
          </label>
          <label class="settings-row" style="margin-top: 0.5rem;">
            <span>Theme</span>
            <select id="theme-mode">
              <option value="white">White</option>
              <option value="paper">Paper</option>
              <option value="dark">Night</option>
            </select>
          </label>
          <p id="nip7-status" class="note"></p>
        </section>
      </div>
      <a class="github-link" href="https://github.com/guaka/bookstr" target="_blank" rel="noopener noreferrer" aria-label="Bookstr on GitHub" title="Bookstr on GitHub">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82A7.65 7.65 0 0 1 8 3.8c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
      </a>
      <p id="build-time" class="note footer-note"></p>
    </section>
    </main>

    <script>
      const FAVORITES_KEY = 'bookstr_nostr_favorites_v1';
      const READING_KEY = 'bookstr_reading_library_v1';
      const WORDS_KEY = 'bookstr_words_v1';
      const SETTINGS_KEY = 'bookstr_reader_settings_v1';
      const NIP7_STATUS_KEY = 'bookstr_nip7_pubkey_v1';
      const NOSTR_RELAYS = ['wss://relay.nomadwiki.org'];
      const NOSTR_FAVORITES_KIND = 30003;
      const NOSTR_PROGRESS_KIND = 30078;
      const FAVORITES_D_TAG = 'libvault-favorites';
      const FAVORITES_CHUNK_PREFIX = 'libvault-favorites-chunk';
      const READING_D_PREFIX = 'app.bookstr.progress.';
      const WORDS_D_PREFIX = 'app.bookstr.vocabulary.';
      const NOSTR_SYNC_CACHE_PREFIX = 'bookstr_nostr_sync_v1_';
      const NOSTR_SYNC_CACHE_TTL_MS = 30 * 60 * 1000;
      const NIP7_CACHE_TTL_MS = 24 * 60 * 60 * 1000;
      const NOSTR_QUERY_TIMEOUT_MS = 5000;

      const status = document.getElementById('status');
      const queryInput = document.getElementById('query-input');
      const searchType = document.getElementById('search-type');
      const searchBtn = document.getElementById('search-btn');
      const searchForm = document.getElementById('search-form');
      const resultsEl = document.getElementById('results');
      const favoritesList = document.getElementById('favorites-list');
      const readingList = document.getElementById('reading-list');
      const wordsList = document.getElementById('words-list');
      const buildTime = document.getElementById('build-time');
      const readerFrame = document.getElementById('reader-frame');
      const settingsBtn = document.getElementById('settings-btn');
      const settingsModal = document.getElementById('settings-modal');
      const settingsPanel = document.getElementById('settings-panel');
      const settingsBackdrop = document.getElementById('settings-backdrop');
      const settingsCloseBtn = document.getElementById('settings-close');
      const autoReadingInput = document.getElementById('auto-reading');
      const nip7EnabledInput = document.getElementById('nip7-enabled');
      const themeModeInput = document.getElementById('theme-mode');
      const npubDisplay = document.getElementById('npub-display');
      const nip7Status = document.getElementById('nip7-status');

      const state = {
        favorites: [],
        reading: [],
        words: [],
        settings: {
          autoReading: true,
          useNip7: true,
          theme: 'white'
        },
        nip7: {
          pubkey: '',
          npub: ''
        }
      };

      function makeSubId(prefix = 'bookstr') {
        const random = (typeof crypto !== 'undefined' && crypto.randomUUID)
          ? crypto.randomUUID().replace(/-/g, '')
          : `${Date.now().toString(16)}-${Math.random().toString(16).slice(2)}`;
        return `${prefix}-${random.slice(0, 14)}`;
      }

      function parseNostrTagsValue(value) {
        return String(value || '').trim();
      }

      function normalizeIsbnFromTag(value) {
        const normalized = parseNostrTagsValue(value)
          .match(/[0-9Xx][0-9Xx\s-]{8,20}[0-9Xx]/g)
          ?.join('')
          ?.replace(/[^0-9Xx]/g, '')
          ?.toUpperCase() ?? '';
        if (normalized.length === 10 || normalized.length === 13) {
          return normalized;
        }
        return '';
      }

      function pseudoIdForSeed(seed) {
        const text = parseNostrTagsValue(seed);
        let hash = 0;
        for (let i = 0; i < text.length; i += 1) {
          hash = ((hash << 5) - hash) + text.charCodeAt(i);
          hash |= 0;
        }
        return `x${Math.abs(hash).toString(16).padStart(8, '0')}`;
      }

      function readRelayEvents(relayUrl, filters) {
        return new Promise((resolve) => {
          const events = [];
          let socket;
          const done = (next) => {
            try {
              if (socket?.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify(['CLOSE', subscription]));
              }
            } catch {
              /* ignore */
            }
            try {
              socket?.close();
            } catch {
              /* ignore */
            }
            resolve(next);
          };

          const subscription = makeSubId('bookstr-sync');
          const timer = setTimeout(() => done(events), NOSTR_QUERY_TIMEOUT_MS);
          const onMessage = (event) => {
            try {
              const packet = JSON.parse(event.data);
              if (!Array.isArray(packet) || packet.length < 2) {
                return;
              }
              const type = packet[0];
              const id = packet[1];
              if (type === 'EVENT' && id === subscription && packet[2]?.pubkey) {
                const payload = packet[2];
                events.push(payload);
                return;
              }
              if (type === 'EOSE' && id === subscription) {
                clearTimeout(timer);
                done(events);
              }
            } catch {
              /* ignore */
            }
          };

          try {
            socket = new WebSocket(relayUrl);
            socket.addEventListener('open', () => {
              socket.send(JSON.stringify(['REQ', subscription, filters]));
            });
            socket.addEventListener('message', onMessage);
            socket.addEventListener('error', () => {
              clearTimeout(timer);
              done(events);
            });
            socket.addEventListener('close', () => {
              clearTimeout(timer);
              resolve(events);
            });
          } catch {
            clearTimeout(timer);
            resolve([]);
          }
        });
      }

      async function queryNostrEvents(pubkey, filters) {
        if (!Array.isArray(NOSTR_RELAYS) || !NOSTR_RELAYS.length || !pubkey) {
          return [];
        }
        const queryFilter = {
          ...((Array.isArray(filters) ? filters[0] : filters) || {}),
          authors: [pubkey],
          limit: ((Array.isArray(filters) ? filters[0] : filters)?.limit) || 200,
        };
        const events = await Promise.all(NOSTR_RELAYS.map((relay) => readRelayEvents(relay, queryFilter)));
        return events.flat().filter(Boolean).sort((a, b) => Number(b.created_at || 0) - Number(a.created_at || 0));
      }

      function sortByUpdatedAt(items) {
        return [...items].sort((a, b) => Number(b.updatedAt || 0) - Number(a.updatedAt || 0));
      }

      async function decryptFavoritePayload(pubkey, payload) {
        if (!payload || typeof payload !== 'string') {
          return [];
        }
        if (window.nostr?.nip44?.decrypt) {
          const plaintext = await window.nostr.nip44.decrypt(pubkey, payload);
          const tags = safeJSONRead(plaintext, []);
          return Array.isArray(tags) ? tags : [];
        }
        throw new Error('NIP-44 decrypt unavailable. Connect a signer with NIP-44 support.');
      }

      function parseSharedFavoriteTags(tags) {
        const entries = [];
        let contextUrl;
        if (!Array.isArray(tags)) {
          return entries;
        }
        for (const rawTag of tags) {
          if (!Array.isArray(rawTag) || typeof rawTag[0] !== 'string') {
            continue;
          }
          const tag = rawTag.map(parseNostrTagsValue);
          const name = tag[0];
          if (name === 'r') {
            contextUrl = tag[1] || contextUrl;
            continue;
          }
          if (name === 'libvault' && isMd5(tag[1])) {
            const md5 = tag[1].toLowerCase();
            const entry = entries.find(item => item.md5 === md5);
            if (entry) {
              entry.url ||= contextUrl || '';
            } else {
              entries.push({ md5, title: '', author: '', url: contextUrl || '' });
            }
            continue;
          }
          if (name === 'libvault-book' && isMd5(tag[1])) {
            const md5 = tag[1].toLowerCase();
            const entry = entries.find(item => item.md5 === md5) || { md5 };
            if (!entries.includes(entry)) entries.push(entry);
            entry.title = tag[2] || entry.title || '';
            entry.author = tag[3] || entry.author || '';
            entry.format = tag[4] || entry.format || '';
            entry.year = tag[6] || entry.year || '';
            entry.url ||= contextUrl || '';
            continue;
          }
          if (name === 'blossom' && isMd5(tag[1])) {
            const md5 = tag[1].toLowerCase();
            const entry = entries.find(item => item.md5 === md5) || { md5 };
            if (!entries.includes(entry)) entries.push(entry);
            entry.blossomSha256 = tag[2] || entry.blossomSha256 || '';
            entry.blossomUrl = tag[3] || entry.blossomUrl || '';
            entry.blossomFormat = tag[4] || entry.blossomFormat || '';
            entry.author = tag[5] || entry.author || '';
            entry.url = tag[3] || entry.url || contextUrl || '';
            continue;
          }
          if (name === 'i' && tag[1]?.startsWith('isbn:') && /^(?:13|10)/.test(normalizeIsbnFromTag(tag[1].slice(5) || ''))) {
            const md5 = isMd5(contextUrl)
              ? contextUrl.toLowerCase()
              : entries.find(item => item.md5)?.md5;
            if (md5) {
              const target = entries.find(item => item.md5 === md5);
              if (target) {
                target.isbn = normalizeIsbnFromTag(tag[1].slice(5) || '');
              }
            }
          }
        }
        return entries;
      }

      function normalizeFavoriteFromRemote(ref) {
        const md5 = isMd5(ref.md5) ? ref.md5.toLowerCase() : null;
        const readUrl = ref.blossomUrl || ref.url || '';
        const usefulTitle = ref.title === 'LibVault favorite' ? '' : ref.title;
        let titleFromUrl = '';
        try {
          const pathname = new URL(readUrl, window.location.href).pathname;
          const filename = decodeURIComponent(pathname.split('/').filter(Boolean).pop() || '');
          titleFromUrl = filename.replace(/\.[^.]+$/, '').replace(/[-_]+/g, ' ').trim();
        } catch (_) {
          // Missing or malformed URLs use the short identifier fallback below.
        }
        return {
          md5: md5 || pseudoIdForSeed(`${usefulTitle || ''}${readUrl}`),
          title: usefulTitle || titleFromUrl || `Book ${(md5 || '').slice(0, 8) || 'unknown'}`,
          authors: ref.author || '',
          year: ref.year || '',
          extension: (ref.blossomFormat || ref.format || 'epub').replace(/^\./, '').toLowerCase(),
          readUrl,
          source: 'nostr',
          sourceUrl: readUrl,
        };
      }

      async function pullNostrFavorites(pubkey) {
        if (!pubkey) return [];
        try {
          const rootEvents = await queryNostrEvents(pubkey, {
            kinds: [NOSTR_FAVORITES_KIND],
            limit: 10,
            '#d': [FAVORITES_D_TAG],
          });
          const latest = rootEvents[0];
          if (!latest) {
            return [];
          }
          const rootTags = await decryptFavoritePayload(pubkey, latest.content);
          const manifest = rootTags.find((tag) => Array.isArray(tag) && tag[0] === 'libvault-chunks');
          const chunks = Array.isArray(manifest) ? Number(manifest[1] || 0) : 0;
          const chunkPrefix = String(manifest?.[2] || FAVORITES_CHUNK_PREFIX);
          let allTags = [...rootTags];
          if (chunks > 0) {
            for (let index = 0; index < chunks; index += 1) {
              const chunkEvents = await queryNostrEvents(pubkey, {
                kinds: [NOSTR_FAVORITES_KIND],
                limit: 10,
                '#d': [`${chunkPrefix}-${index}`],
              });
              const chunkLatest = chunkEvents[0];
              if (!chunkLatest) {
                continue;
              }
              const chunkTags = await decryptFavoritePayload(pubkey, chunkLatest.content);
              if (Array.isArray(chunkTags)) {
                allTags = allTags.concat(chunkTags);
              }
            }
          }
          return parseSharedFavoriteTags(allTags).map(normalizeFavoriteFromRemote);
        } catch {
          return [];
        }
      }

      function parseReadingProgressEvent(event) {
        try {
          const payload = JSON.parse(event.content);
          const created = Number(event.created_at || 0) * 1000;
          const bookId = String(payload.bookId || '').trim();
          const updatedAt = Number(payload.updatedAt) || created;
          if (!bookId) return null;
          const locator = payload.locator && typeof payload.locator === 'object'
            ? payload.locator
            : null;
          const hasProgression = payload.progression != null
            || (locator && typeof locator.progression === 'number');
          if (!hasProgression) {
            return null;
          }
          return {
            md5: bookId.toLowerCase(),
            title: String(payload.title || 'Saved book'),
            authors: String(payload.author || ''),
            updatedAt,
            extension: 'epub',
            readUrl: payload.readUrl || '',
          };
        } catch {
          return null;
        }
      }

      async function pullNostrReading(pubkey) {
        if (!pubkey) return [];
        const events = await queryNostrEvents(pubkey, {
          kinds: [NOSTR_PROGRESS_KIND],
          limit: 100,
        });
        const latestByBook = new Map();
        for (const event of events) {
          const parsed = parseReadingProgressEvent(event);
          if (!parsed || !parsed.md5) {
            continue;
          }
          const exists = latestByBook.get(parsed.md5);
          if (!exists || parsed.updatedAt > (exists.updatedAt || 0)) {
            latestByBook.set(parsed.md5, parsed);
          }
        }
        return sortByUpdatedAt(Array.from(latestByBook.values())).slice(0, 50);
      }

      async function decryptVocabularyPayload(pubkey, event) {
        const dTag = Array.isArray(event.tags)
          ? event.tags.find((tag) => Array.isArray(tag) && tag[0] === 'd')?.[1]
          : '';
        if (!dTag || !dTag.startsWith(WORDS_D_PREFIX)) {
          return null;
        }
        if (!window.nostr?.nip44?.decrypt) {
          return null;
        }
        const plaintext = await window.nostr.nip44.decrypt(pubkey, event.content);
        const payload = safeJSONRead(plaintext, null);
        if (!payload || typeof payload !== 'object') {
          return null;
        }
        const word = String(payload.word || '').trim().toLowerCase();
        if (!word) {
          return null;
        }
        return {
          word,
          updatedAt: Number(payload.updatedAt) || Number(event.created_at || 0) * 1000,
        };
      }

      async function pullNostrWords(pubkey) {
        if (!pubkey) return [];
        const events = await queryNostrEvents(pubkey, {
          kinds: [NOSTR_PROGRESS_KIND],
          limit: 120,
        });
        const latestByWord = new Map();
        for (const event of events) {
          const payload = await decryptVocabularyPayload(pubkey, event);
          if (!payload) {
            continue;
          }
          const exists = latestByWord.get(payload.word);
          if (!exists || payload.updatedAt > exists.updatedAt) {
            latestByWord.set(payload.word, payload);
          }
        }
        return sortByUpdatedAt(Array.from(latestByWord.values())).map(entry => entry.word);
      }

      function mergeStateList(primary, incoming, { dedupeBy = 'md5' } = {}) {
        const next = [...primary];
        for (const item of incoming) {
          if (!item || typeof item !== 'object') {
            continue;
          }
          const id = item[dedupeBy];
          if (!id) {
            continue;
          }
          const index = next.findIndex((row) => row && row[dedupeBy] === id);
          if (index >= 0) {
            next[index] = { ...next[index], ...item, dedupSource: 'nostr', updatedAt: Number(item.updatedAt || Date.now()) };
          } else {
            next.push(item);
          }
        }
        return next;
      }

      function readNostrSyncCache(pubkey) {
        if (!pubkey) return null;
        const cacheKey = `${NOSTR_SYNC_CACHE_PREFIX}${pubkey}`;
        const payload = safeJSONRead(localStorage.getItem(cacheKey), null);
        if (!payload || typeof payload !== 'object') return null;
        const ts = Number(payload.ts || 0);
        if (!Number.isFinite(ts)) return null;
        if (!Array.isArray(payload.favorites) || !Array.isArray(payload.reading) || !Array.isArray(payload.words)) return null;
        return {
          favorites: payload.favorites.filter(item => item && typeof item.md5 === 'string'),
          reading: payload.reading.filter(item => item && typeof item.md5 === 'string'),
          words: payload.words.filter(item => typeof item === 'string').map(item => item.toLowerCase()),
          ts,
          version: Number(payload.version || 0) || 0,
          pubkey: payload.pubkey || pubkey,
        };
      }

      function saveNostrSyncCache(pubkey, payload) {
        if (!pubkey || !payload || typeof payload !== 'object') return;
        const cacheKey = `${NOSTR_SYNC_CACHE_PREFIX}${pubkey}`;
        const next = {
          favorites: Array.isArray(payload.favorites) ? payload.favorites : [],
          reading: Array.isArray(payload.reading) ? payload.reading : [],
          words: Array.isArray(payload.words) ? payload.words : [],
          ts: Date.now(),
          version: 1,
          pubkey,
        };
        localStorage.setItem(cacheKey, JSON.stringify(next));
      }

      function applyNostrSnapshot(snapshot, { render = true } = {}) {
        const next = { ...snapshot };
        if (Array.isArray(next.favorites)) {
          state.favorites = mergeStateList(state.favorites, next.favorites)
            .slice(0, 50);
        }
        if (Array.isArray(next.reading)) {
          state.reading = mergeStateList(state.reading, next.reading)
            .sort((a, b) => Number(b.updatedAt || 0) - Number(a.updatedAt || 0))
            .slice(0, 50);
        }
        if (Array.isArray(next.words)) {
          const merged = [];
          const seen = new Set();
          const append = (word) => {
            const item = String(word || '').trim().toLowerCase();
            if (!item || seen.has(item)) return;
            seen.add(item);
            merged.push(item);
          };
          next.words.forEach(append);
          state.words.forEach(append);
          state.words = merged.slice(0, 50);
        }
        localStorage.setItem(FAVORITES_KEY, JSON.stringify(state.favorites));
        localStorage.setItem(READING_KEY, JSON.stringify(state.reading));
        localStorage.setItem(WORDS_KEY, JSON.stringify(state.words));
        if (render) {
          renderFavorites();
          renderReading();
          renderWords();
        }
      }

      function isNostrCacheFresh(cached) {
        if (!cached || typeof cached !== 'object') return false;
        return Date.now() - Number(cached.ts || 0) < NOSTR_SYNC_CACHE_TTL_MS;
      }

      let nostrSyncTask = null;

      async function syncNostrLibraryFromNip7() {
        const pubkey = state.nip7.pubkey;
        if (!state.settings.useNip7 || !pubkey) {
          return false;
        }
        if (nostrSyncTask) {
          return nostrSyncTask;
        }
        const task = (async () => {
          const cached = readNostrSyncCache(pubkey);
          if (cached && isNostrCacheFresh(cached)) {
            applyNostrSnapshot(cached);
          }
          try {
            const [favorites, reading, words] = await Promise.all([
              pullNostrFavorites(pubkey),
              pullNostrReading(pubkey),
              pullNostrWords(pubkey),
            ]);
            applyNostrSnapshot({
              favorites,
              reading,
              words,
            });
            saveNostrSyncCache(pubkey, {
              favorites: state.favorites,
              reading: state.reading,
              words: state.words,
            });
            if (document.activeElement !== null) {
              status.textContent = 'Synced latest Nostr library data.';
            }
            return true;
          } catch {
            return false;
          }
        })();
        nostrSyncTask = task.finally(() => {
          nostrSyncTask = null;
        });
        return task;
      }

      function safeJSONRead(raw, fallback) {
        if (!raw) return fallback;
        try {
          const parsed = JSON.parse(raw);
          return parsed;
        } catch (error) {
          return fallback;
        }
      }

      function clampWords(value) {
        return value
          .replace(/[^\p{L}\p{N}]+/gu, ' ')
          .trim()
          .toLowerCase()
          .split(/\s+/)
          .filter(Boolean)
          .slice(0, 12);
      }

      function normalizeSearchBooks(payload, source) {
        const results = Array.isArray(payload?.books)
          ? payload.books
          : Array.isArray(payload?.results)
            ? payload.results
            : [];

        return results.map(item => {
          const md5 = String(item.md5 || item.id || item.sha256 || item.libvaultMd5 || '').trim().toLowerCase();
          const authors = Array.isArray(item.authors)
            ? item.authors.join(', ')
            : String(item.author || item.authors || 'Unknown author');
          const year = String(item.issued || item.year || '').split('-')[0];
          const ext = String(item.extension || item.format || item.media_type || item.type || 'epub').replace(/^\./, '').toLowerCase();
          const provider = String(item.source || source).toLowerCase();
          const directReadUrl = provider === 'gutenberg' && item.id
            ? `https://all.books.party/api/books/${encodeURIComponent(item.id)}/download`
            : item.readUrl || item.url || item.link || '';
          return {
            md5,
            title: item.title || 'Untitled',
            authors,
            year,
            publisher: item.publisher || '',
            extension: ext,
            filesize: Number(item.filesize_bytes || item.filesize || 0),
            source: item.source || source,
            readUrl: directReadUrl,
            fallback: Boolean(directReadUrl)
          };
        });
      }

      function formatBuildDate(date) {
        if (Number.isNaN(date.getTime())) {
          return '';
        }
        const year = String(date.getFullYear());
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        const hours = String(date.getHours()).padStart(2, '0');
        const minutes = String(date.getMinutes()).padStart(2, '0');
        return `${year}-${month}-${day} ${hours}:${minutes}`;
      }

      function escapeHtml(value) {
        return String(value ?? '')
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;')
          .replaceAll('"', '&quot;')
          .replaceAll("'", '&#39;');
      }

      function bytesLabel(value) {
        let n = Number(value) || 0;
        const units = ['B', 'KB', 'MB', 'GB'];
        let i = 0;
        while (n >= 1024 && i < units.length - 1) {
          n /= 1024;
          i++;
        }
        return `${n.toFixed(i === 0 ? 0 : 1)} ${units[i]}`;
      }

      function isMd5(value) {
        return /^[0-9a-f]{32}$/i.test(String(value || '').trim());
      }

      function findById(list, id) {
        return list.findIndex(item => item.md5 === id);
      }

      function upsertById(list, entry) {
        const index = findById(list, entry.md5);
        if (index >= 0) {
          list[index] = { ...list[index], ...entry, updatedAt: Date.now() };
          return;
        }
        list.push({ ...entry, updatedAt: Date.now() });
      }

      function removeById(list, id) {
        const index = findById(list, id);
        if (index >= 0) {
          list.splice(index, 1);
        }
      }

      function recordWords(query) {
        const tokens = clampWords(query);
        if (!tokens.length) {
          return;
        }
        tokens.forEach(token => {
          const i = state.words.indexOf(token);
          if (i !== -1) {
            state.words.splice(i, 1);
          }
          state.words.unshift(token);
        });
        state.words = state.words.slice(0, 50);
        localStorage.setItem(WORDS_KEY, JSON.stringify(state.words));
        renderWords();
      }

      function renderWords() {
        wordsList.innerHTML = '';
        if (!state.words.length) {
          wordsList.textContent = 'No words yet.';
          return;
        }
        for (const word of state.words.slice().sort((a, b) => a.localeCompare(b)).slice(0, 36)) {
          const link = document.createElement('a');
          link.className = 'badge';
          link.href = `https://en.wiktionary.org/wiki/${encodeURIComponent(word)}`;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.textContent = word;
          wordsList.appendChild(link);
        }
      }

      function renderFavorites() {
        favoritesList.innerHTML = '';
        if (!state.favorites.length) {
          const p = document.createElement('li');
          p.textContent = 'No Nostr favorites yet.';
          favoritesList.appendChild(p);
          return;
        }
        for (const entry of state.favorites) {
          const item = document.createElement('li');
          item.textContent = `${entry.title} · ${entry.authors}`;
          item.title = `Open ${entry.title}`;
          item.style.cursor = 'pointer';
          item.addEventListener('click', () => openBook(entry));
          favoritesList.appendChild(item);
        }
      }

      function renderReading() {
        readingList.innerHTML = '';
        if (!state.reading.length) {
          const item = document.createElement('li');
          item.textContent = 'Open a result and it will appear here.';
          readingList.appendChild(item);
          return;
        }
        for (const entry of state.reading) {
          const item = document.createElement('li');
          item.textContent = `${entry.title} · ${entry.authors}`;
          item.title = `Open ${entry.title}`;
          item.style.cursor = 'pointer';
          item.addEventListener('click', () => openBook(entry));
          readingList.appendChild(item);
        }
      }

      function renderResults(books) {
        resultsEl.innerHTML = '';
        if (!books.length) {
          resultsEl.innerHTML = '<p class="note">No matches. Try a shorter query.</p>';
          return;
        }
        for (const book of books) {
          const canRead = isMd5(book.md5) || book.fallback;
          const row = document.createElement('article');
          row.className = 'result-item';
          row.innerHTML = `
            <div class="result-head">
              <div>
                <div class="result-title">${escapeHtml(book.title)}${book.year ? ` (${escapeHtml(book.year)})` : ''}</div>
                <p class="result-meta">${escapeHtml(book.authors)}${book.publisher ? ` · ${escapeHtml(book.publisher)}` : ''} · ${escapeHtml(book.source)}</p>
              </div>
              <div class="row-actions">
                <button type="button" class="chip-btn" data-action="favorite" data-md5="${escapeHtml(book.md5)}">${isFavoriteMd5(book.md5) ? 'Unfav' : 'Fav'}</button>
                <button type="button" data-action="open" data-md5="${escapeHtml(book.md5)}" data-title="${escapeHtml(book.title)}" data-authors="${escapeHtml(book.authors)}" data-format="${escapeHtml(book.extension)}">${canRead ? 'Read' : 'Search-only'}</button>
              </div>
            </div>
            <div class="result-tags">
              <span class="badge">${escapeHtml(book.extension || 'book')}</span>
              <span class="badge">${escapeHtml(bytesLabel(book.filesize) )}</span>
              ${isMd5(book.md5) ? `<span class="badge">${escapeHtml(book.md5.slice(0, 8))}…</span>` : ''}
            </div>
          `;
          row.querySelector('[data-action="open"]').disabled = !canRead;
          row.querySelector('[data-action="open"]').addEventListener('click', () => openBook(book));
          row.querySelector('[data-action="favorite"]').addEventListener('click', (event) => {
            toggleFavorite(book, event.currentTarget);
          });
          resultsEl.appendChild(row);
        }
      }

      function isFavoriteMd5(md5) {
        if (!isMd5(md5)) return false;
        return state.favorites.some(item => item.md5 === md5);
      }

      function toggleFavorite(book, button) {
        if (!isMd5(book.md5)) {
          status.textContent = 'This result cannot be favorite-added (missing md5).';
          return;
        }
        const exists = state.favorites.findIndex(item => item.md5 === book.md5);
        if (exists >= 0) {
          removeById(state.favorites, book.md5);
          if (button) {
            button.textContent = 'Fav';
            button.setAttribute('aria-pressed', 'false');
          }
        } else {
          upsertById(state.favorites, {
            md5: book.md5,
            title: book.title,
            authors: book.authors,
            year: book.year || '',
            extension: book.extension || 'epub'
          });
          if (button) {
            button.textContent = 'Unfav';
            button.setAttribute('aria-pressed', 'true');
          }
        }
        state.favorites = state.favorites.slice(0, 50);
        localStorage.setItem(FAVORITES_KEY, JSON.stringify(state.favorites));
        renderFavorites();
      }

      function renderButtonsState() {
        const rows = Array.from(resultsEl.querySelectorAll('[data-action="favorite"]'));
        for (const btn of rows) {
          const md5 = btn.getAttribute('data-md5') || '';
          const pressed = isFavoriteMd5(md5);
          btn.textContent = pressed ? 'Unfav' : 'Fav';
          btn.setAttribute('aria-pressed', String(pressed));
        }
      }

      function setHashRoute(route) {
        const nextHash = route ? `#${route}` : '';
        if (window.location.hash === nextHash) return;
        history.pushState(null, '', `${window.location.pathname}${window.location.search}${nextHash}`);
      }

      function openBook(book, { updateHash = true, addToReading = true } = {}) {
        if (!book || (!isMd5(book.md5) && !book.readUrl && !book.url)) {
          status.textContent = 'No direct read link for this item.';
          return;
        }

        const readPath = book.readUrl || book.url || (isMd5(book.md5)
          ? `/api/read/${encodeURIComponent(book.md5)}`
          : '');

        const isBlob = readPath.startsWith('blob:') || /^https?:/i.test(readPath);
        readerFrame.src = isBlob ? readPath : `${readPath}`;
        status.textContent = `Opening ${book.title || 'book'}…`;
        if (updateHash) {
          setHashRoute(`read=${encodeURIComponent(readPath)}`);
        }

        if (addToReading && state.settings.autoReading && isMd5(book.md5)) {
          upsertById(state.reading, {
            md5: book.md5,
            title: book.title,
            authors: book.authors,
            year: book.year || '',
            extension: book.extension || 'epub'
          });
          state.reading = state.reading.sort((a, b) => b.updatedAt - a.updatedAt).slice(0, 50);
          localStorage.setItem(READING_KEY, JSON.stringify(state.reading));
          renderReading();
        }
      }

      async function searchAllBooksParty(query) {
        const resp = await fetch(`https://all.books.party/api/search?q=${encodeURIComponent(query)}&limit=20`);
        const payload = await resp.json().catch(() => ({}));
        if (!resp.ok) {
          const msg = payload?.error || `search failed (${resp.status})`;
          throw new Error(msg);
        }
        return normalizeSearchBooks(payload, 'all.books.party');
      }

      async function startSearch({ updateHash = true } = {}) {
        const query = queryInput.value.trim();
        if (!query || query.length < 2) {
          status.textContent = 'Type at least 2 characters to search.';
          queryInput.focus();
          return;
        }
        if (updateHash) {
          setHashRoute(`search=${encodeURIComponent(query)}`);
        }
        searchBtn.disabled = true;
        resultsEl.innerHTML = '';
        status.textContent = 'Searching…';
        try {
          const books = await searchAllBooksParty(query);
          status.textContent = `all.books.party returned ${books.length} result(s).`;
          renderResults(books);
          renderButtonsState();
          if (books.length) {
            recordWords(query);
          } else {
            status.textContent += ' No matches found.';
          }
        } catch (error) {
          status.textContent = `Search failed: ${error.message || error}`;
          resultsEl.innerHTML = '<p class="note">Search failed. Check your network connection and try again.</p>';
        } finally {
          searchBtn.disabled = false;
        }
      }

      function loadState() {
        const favorites = safeJSONRead(localStorage.getItem(FAVORITES_KEY), []);
        const reading = safeJSONRead(localStorage.getItem(READING_KEY), []);
        const words = safeJSONRead(localStorage.getItem(WORDS_KEY), []);
        const settings = safeJSONRead(localStorage.getItem(SETTINGS_KEY), { autoReading: true, useNip7: true, theme: 'white' });
        const nip7 = safeJSONRead(localStorage.getItem(NIP7_STATUS_KEY), { pubkey: '', npub: '', ts: 0 });
        const hasFreshNip7Status = Date.now() - Number(nip7.ts || 0) < NIP7_CACHE_TTL_MS;

        if (Array.isArray(favorites)) {
          state.favorites = favorites
            .filter(item => item && typeof item.md5 === 'string')
            .filter(item => item.md5)
            .map(item => normalizeFavoriteFromRemote(item))
            .slice(0, 50);
        }
        if (Array.isArray(reading)) {
          state.reading = reading
            .filter(item => item && typeof item.md5 === 'string')
            .sort((a, b) => Number(b.updatedAt || 0) - Number(a.updatedAt || 0))
            .slice(0, 50);
        }
        if (Array.isArray(words)) {
          state.words = words.filter(v => typeof v === 'string').map(v => v.toLowerCase()).slice(0, 50);
        }
        if (settings && typeof settings === 'object') {
          if (typeof settings.autoReading === 'boolean') {
            state.settings.autoReading = settings.autoReading;
          }
          if (typeof settings.useNip7 === 'boolean') {
            state.settings.useNip7 = settings.useNip7;
          }
          if (typeof settings.theme === 'string') {
            state.settings.theme = settings.theme;
          }
        }
        if (nip7 && typeof nip7.pubkey === 'string') {
          state.nip7.pubkey = nip7.pubkey;
        }
        if (typeof nip7.npub === 'string' && nip7.npub) {
          state.nip7.npub = nip7.npub;
        }

        autoReadingInput.checked = Boolean(state.settings.autoReading);
        nip7EnabledInput.checked = Boolean(state.settings.useNip7);
        themeModeInput.value = ['white', 'paper', 'dark'].includes(state.settings.theme) ? state.settings.theme : 'white';
        applyTheme(themeModeInput.value);
        renderFavorites();
        renderReading();
        renderWords();
        updateNip7Status();
        if (state.settings.useNip7) {
          const cached = readNostrSyncCache(state.nip7.pubkey || '');
          if (cached) {
            applyNostrSnapshot(cached);
          }
          void connectNip7({ silent: true, quick: hasFreshNip7Status });
        }
      }

      function shortPubkey(pubkey) {
        const npub = publicKeyToNpub(pubkey);
        if (npub) {
          return npub;
        }
        if (!pubkey || pubkey.length <= 12) return pubkey;
        return `${pubkey.slice(0, 8)}…${pubkey.slice(-4)}`;
      }

      function publicKeyToNpub(pubkey) {
        const hex = String(pubkey || '').trim().toLowerCase();
        if (!/^[0-9a-f]{64}$/.test(hex)) {
          return '';
        }
        if (window.nostr?.nip19?.npubEncode && typeof window.nostr.nip19.npubEncode === 'function') {
          try {
            return window.nostr.nip19.npubEncode(hex);
          } catch {
            // fallback to local encoder below
          }
        }

        const bytes = [];
        for (let i = 0; i < 32; i++) {
          const idx = i * 2;
          const byte = parseInt(hex.slice(idx, idx + 2), 16);
          if (Number.isNaN(byte)) {
            return '';
          }
          bytes.push(byte);
        }
        const data = convertBits(bytes, 8, 5, true);
        if (!data) {
          return '';
        }
        const values = [0].concat(data);
        const encoded = bech32Encode('npub', values);
        return encoded;
      }

      function convertBits(data, fromWidth, toWidth, pad = false) {
        let acc = 0;
        let bits = 0;
        const maxv = (1 << toWidth) - 1;
        const out = [];
        for (const value of data) {
          if (value < 0 || value >> fromWidth) {
            return null;
          }
          acc = (acc << fromWidth) | value;
          bits += fromWidth;
          while (bits >= toWidth) {
            bits -= toWidth;
            out.push((acc >> bits) & maxv);
          }
        }
        if (pad) {
          if (bits > 0) {
            out.push((acc << (toWidth - bits)) & maxv);
          }
        } else if (bits >= fromWidth || ((acc << (toWidth - bits)) & maxv)) {
          return null;
        }
        return out;
      }

      function bech32Polymod(values) {
        let chk = 1;
        const gen = [
          0x3b6a57b2,
          0x26508e6d,
          0x1ea119fa,
          0x3d4233dd,
          0x2a1462b3
        ];
        for (const value of values) {
          const top = chk >> 25;
          chk = ((chk & 0x1ffffff) << 5) ^ value;
          if (top & 1) chk ^= gen[0];
          if (top & 2) chk ^= gen[1];
          if (top & 4) chk ^= gen[2];
          if (top & 8) chk ^= gen[3];
          if (top & 16) chk ^= gen[4];
        }
        return chk ^ 1;
      }

      function bech32CreateChecksum(hrp, data) {
        const values = hrpExpand(hrp).concat(data, [0, 0, 0, 0, 0, 0]);
        const mod = bech32Polymod(values);
        const out = [];
        for (let i = 0; i < 6; i++) {
          out.push((mod >> (5 * (5 - i))) & 31);
        }
        return out;
      }

      function hrpExpand(hrp) {
        const ret = [];
        for (let i = 0; i < hrp.length; i++) {
          ret.push(hrp.charCodeAt(i) >> 5);
        }
        ret.push(0);
        for (let i = 0; i < hrp.length; i++) {
          ret.push(hrp.charCodeAt(i) & 31);
        }
        return ret;
      }

      function bech32Encode(hrp, data) {
        const charSet = 'qpzry9x8gf2tvdw0s3jn54khce6mua7l';
        const checksum = bech32CreateChecksum(hrp, data);
        let out = '';
        for (const v of data.concat(checksum)) {
          out += charSet[v];
        }
        return `${hrp}1${out}`;
      }

      function updateNip7Status() {
        if (!state.settings.useNip7) {
          const msg = 'Auto NIP-07 is disabled.';
          nip7Status.textContent = msg;
          if (npubDisplay) {
            npubDisplay.textContent = 'disabled';
          }
          return;
        }
        if (!state.nip7.pubkey) {
          const msg = 'NIP-07 not connected yet.';
          nip7Status.textContent = msg;
          if (npubDisplay) {
            npubDisplay.textContent = 'not connected';
          }
          return;
        }
        const npub = state.nip7.npub || publicKeyToNpub(state.nip7.pubkey) || '';
        if (npub) {
          state.nip7.npub = npub;
        }
        const shown = npub || shortPubkey(state.nip7.pubkey);
        nip7Status.textContent = `NIP-07 connected ${shown}.`;
        if (npubDisplay) {
          npubDisplay.textContent = shown.length > 22
            ? `${shown.slice(0, 12)}…${shown.slice(-6)}`
            : shown;
          npubDisplay.title = shown;
        }
      }

      function applyTheme(theme) {
        const normalized = ['white', 'paper', 'dark'].includes(theme) ? theme : 'white';
        state.settings.theme = normalized;
        document.body.classList.remove('theme-white', 'theme-paper', 'theme-dark');
        document.body.classList.add(`theme-${normalized}`);
      }

      async function connectNip7(opts = {}) {
        const previous = safeJSONRead(localStorage.getItem(NIP7_STATUS_KEY), null);
        if (!state.settings.useNip7) {
          state.nip7.pubkey = '';
          localStorage.removeItem(NIP7_STATUS_KEY);
          updateNip7Status();
          return false;
        }

        if (!window.nostr || typeof window.nostr.getPublicKey !== 'function') {
          if (opts.silent && previous && typeof previous.pubkey === 'string' && previous.pubkey) {
            state.nip7.pubkey = previous.pubkey;
            state.nip7.npub = typeof previous.npub === 'string' ? previous.npub : '';
            updateNip7Status();
            return false;
          }
          state.nip7.pubkey = '';
          localStorage.removeItem(NIP7_STATUS_KEY);
          updateNip7Status();
          if (!opts.silent) {
            status.textContent = 'NIP-07 not found. Install or enable a browser extension.';
          }
          return false;
        }

        try {
          if (typeof window.nostr.enable === 'function') {
            try {
              await Promise.resolve(window.nostr.enable());
            } catch {
              // ignore; getPublicKey may still work when permissions are already granted
            }
          }

          const getPublicKeyPromise = Promise.resolve(window.nostr.getPublicKey());
          const timeoutMs = opts.silent ? (opts.quick ? 1200 : 9000) : 15000;
          const pubkey = await Promise.race([
            getPublicKeyPromise,
            new Promise((_, reject) => setTimeout(() => reject(new Error('NIP-07 timeout')), timeoutMs))
          ]);
          state.nip7.pubkey = String(pubkey || '');
          state.nip7.npub = publicKeyToNpub(state.nip7.pubkey) || '';
          localStorage.setItem(NIP7_STATUS_KEY, JSON.stringify({
            pubkey: state.nip7.pubkey,
            npub: state.nip7.npub,
            ts: Date.now()
          }));
          updateNip7Status();
          if (!opts.silent) {
            status.textContent = 'Connected to NIP-07 provider.';
          }
          void syncNostrLibraryFromNip7();
          return true;
        } catch (error) {
          if (opts.silent && previous && typeof previous.pubkey === 'string' && previous.pubkey) {
            state.nip7.pubkey = previous.pubkey;
            state.nip7.npub = typeof previous.npub === 'string' ? previous.npub : '';
            localStorage.setItem(NIP7_STATUS_KEY, JSON.stringify({
              pubkey: state.nip7.pubkey,
              npub: state.nip7.npub,
              ts: Date.now()
            }));
            updateNip7Status();
            return false;
          }
          state.nip7.pubkey = '';
          localStorage.removeItem(NIP7_STATUS_KEY);
          updateNip7Status();
          if (!opts.silent) {
            status.textContent = `NIP-07 connect failed: ${error?.message || error}`;
          }
          return false;
        }
      }

      function applySettingsFromUI() {
        state.settings.autoReading = autoReadingInput.checked;
        state.settings.useNip7 = nip7EnabledInput.checked;
        state.settings.theme = themeModeInput.value;
        applyTheme(state.settings.theme);
        localStorage.setItem(SETTINGS_KEY, JSON.stringify(state.settings));
        if (!state.settings.useNip7) {
          state.nip7.pubkey = '';
          localStorage.removeItem(NIP7_STATUS_KEY);
        }
        updateNip7Status();
        if (state.settings.useNip7) {
          void connectNip7();
        }
      }

      let settingsReturnFocus = null;

      function openSettings({ updateHash = true } = {}) {
        settingsModal.classList.remove('hidden');
        settingsModal.setAttribute('aria-hidden', 'false');
        settingsBtn.setAttribute('aria-pressed', 'true');
        settingsReturnFocus = document.activeElement;
        const firstInput = settingsPanel.querySelector('input, button, select, textarea, [tabindex]:not([tabindex="-1"])');
        (firstInput || settingsCloseBtn).focus?.();

        if (state.settings.useNip7 && !state.nip7.pubkey) {
          void connectNip7();
        }
        if (updateHash) {
          setHashRoute('settings');
        }
      }

      function closeSettings({ updateHash = true } = {}) {
        settingsModal.classList.add('hidden');
        settingsModal.setAttribute('aria-hidden', 'true');
        settingsBtn.setAttribute('aria-pressed', 'false');
        if (settingsReturnFocus && typeof settingsReturnFocus.focus === 'function') {
          settingsReturnFocus.focus();
        } else {
          settingsBtn.focus();
        }
        if (updateHash && window.location.hash === '#settings') {
          setHashRoute('');
        }
      }

      function applyHashRoute() {
        const route = window.location.hash.slice(1);
        if (route === 'settings') {
          openSettings({ updateHash: false });
          return;
        }
        if (!settingsModal.classList.contains('hidden')) {
          closeSettings({ updateHash: false });
        }
        if (route.startsWith('search=')) {
          const query = decodeURIComponent(route.slice('search='.length));
          if (query.length >= 2) {
            queryInput.value = query;
            void startSearch({ updateHash: false });
          }
          return;
        }
        if (route.startsWith('read=')) {
          const readUrl = decodeURIComponent(route.slice('read='.length));
          if (/^(https?:|blob:)/i.test(readUrl)) {
            openBook({ title: 'book', readUrl }, { updateHash: false, addToReading: false });
          }
        }
      }

      settingsBtn.addEventListener('click', () => {
        if (settingsModal.classList.contains('hidden')) {
          openSettings();
        } else {
          closeSettings();
        }
      });

      settingsCloseBtn.addEventListener('click', () => {
        closeSettings();
      });

      settingsBackdrop.addEventListener('click', () => {
        closeSettings();
      });

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && !settingsModal.classList.contains('hidden')) {
          event.preventDefault();
          closeSettings();
        }
      });

      autoReadingInput.addEventListener('change', applySettingsFromUI);
      nip7EnabledInput.addEventListener('change', applySettingsFromUI);
      themeModeInput.addEventListener('change', applySettingsFromUI);

      searchForm.addEventListener('submit', (event) => {
        event.preventDefault();
        startSearch();
      });

      window.addEventListener('popstate', applyHashRoute);
      window.addEventListener('hashchange', applyHashRoute);

      const fileTime = new Date(document.lastModified);
      buildTime.textContent = Number.isNaN(fileTime.getTime())
        ? 'Unavailable'
        : formatBuildDate(fileTime);

      queryInput.focus();
      queryInput.setSelectionRange(queryInput.value.length, queryInput.value.length);
      loadState();
      applyHashRoute();
      if (!window.location.hash) {
        status.textContent = 'Search by title, author, ISBN, or publisher to begin.';
      }
    </script>
  </body>
</html>
