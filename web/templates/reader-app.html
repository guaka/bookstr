<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>bookstr reader</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f7f3ea;
      color: #1c1916;
      touch-action: manipulation;
      --reader-progress: #2f5d50;
      --reader-progress-track: rgba(47, 93, 80, 0.22);
    }
    body.white {
      background: #ffffff;
      color: #1c1916;
    }
    body.night {
      background: #121212;
      color: #e8e4dc;
      --reader-progress: #7fb8a7;
      --reader-progress-track: rgba(127, 184, 167, 0.24);
    }
    #viewer {
      width: 100vw;
      height: 100vh;
      background: inherit;
    }
    .reader-header { display: none; }
    body.desktop-reader .reader-header {
      position: fixed;
      z-index: 16;
      top: 0;
      right: 0;
      left: 0;
      display: flex;
      align-items: center;
      gap: 0.65rem;
      height: 3rem;
      padding: 0 0.7rem;
      box-sizing: border-box;
      background: color-mix(in srgb, var(--reader-progress) 96%, transparent);
      color: #f7f3ea;
      font-family: system-ui, sans-serif;
      box-shadow: 0 1px 12px rgba(0, 0, 0, 0.14);
    }
    .reader-mark { width: 1.45rem; height: 1.45rem; flex: 0 0 auto; }
    .reader-menu { position: relative; flex: 0 0 auto; }
    #reader-menu-toggle { width: 2rem; height: 2rem; font-size: 1.25rem; }
    #reader-menu { position: absolute; top: 2.35rem; right: 0; min-width: 8rem; padding: 0.35rem; border: 1px solid rgba(255,255,255,0.22); border-radius: 0.55rem; background: #2f5d50; box-shadow: 0 0.5rem 1.5rem rgba(0,0,0,0.28); }
    #reader-menu[hidden] { display: none; }
    #reader-menu button { display: block; width: 100%; padding: 0.45rem 0.6rem; text-align: left; font: inherit; font-size: 0.78rem; border-radius: 0.3rem; }
    #reader-menu button:hover, #reader-menu button:focus-visible { background: rgba(255,255,255,0.14); outline: none; }
    body.desktop-reader #viewer { height: calc(100vh - 3rem); margin-top: 3rem; }
    .reader-header button {
      border: 0;
      background: transparent;
      color: inherit;
      cursor: pointer;
    }
    #reader-back { width: 2rem; height: 2rem; font-size: 1.5rem; line-height: 1; }
    .reader-header-copy { min-width: 0; flex: 1; line-height: 1.1; }
    #reader-header-title, #reader-header-byline { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #reader-header-title { font-size: 0.82rem; font-weight: 650; }
    #reader-header-byline { margin-top: 0.18rem; font-size: 0.68rem; opacity: 0.8; }
    #reader-header-rights { font-size: 0.7rem; opacity: 0.9; white-space: nowrap; }
    .reader-nav {
      position: fixed;
      z-index: 12;
      top: 50%;
      width: 3rem;
      height: 6rem;
      border: 0;
      padding: 0;
      transform: translateY(-50%);
      background: transparent;
      color: currentColor;
      font: 400 2.7rem/1 Georgia, serif;
      opacity: 0.34;
      cursor: pointer;
    }
    .reader-nav:hover,
    .reader-nav:focus-visible {
      opacity: 0.9;
      outline: 2px solid currentColor;
      outline-offset: -2px;
    }
    #reader-prev { left: 0; }
    #reader-next { right: 0; }
    .epub-container {
      background: inherit !important;
      overflow-x: hidden !important;
      overflow-y: auto !important;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .epub-view,
    .epub-view iframe {
      background: inherit !important;
    }
    .epub-container::-webkit-scrollbar { display: none; }
    #reader-footer {
      position: fixed;
      z-index: 14;
      right: 0;
      bottom: 0;
      left: 0;
      height: 1.15rem;
      background: color-mix(in srgb, currentColor 5%, transparent);
      color: currentColor;
      font: 600 0.65rem/1.15rem system-ui, sans-serif;
      text-align: right;
      pointer-events: none;
    }
    #reader-progress-track {
      position: absolute;
      top: 0;
      right: 0;
      left: 0;
      height: 3px;
      background: var(--reader-progress-track);
    }
    #reader-progress-value {
      display: block;
      width: 0;
      height: 100%;
      background: var(--reader-progress);
      transition: width 160ms ease-out;
    }
    #reader-progress-text { padding-right: 0.45rem; opacity: 0.72; }
    #dictionary-card {
      position: fixed;
      z-index: 20;
      left: 0.65rem;
      right: 0.65rem;
      bottom: 0.65rem;
      max-height: 48vh;
      overflow-y: auto;
      border: 1px solid rgba(128, 128, 128, 0.55);
      border-radius: 0.8rem;
      padding: 0.9rem;
      box-sizing: border-box;
      background: #f7f3ea;
      color: #1c1916;
      box-shadow: 0 0.8rem 2.5rem rgba(0, 0, 0, 0.35);
      font-family: system-ui, sans-serif;
    }
    body.white #dictionary-card { background: #ffffff; color: #1c1916; }
    body.night #dictionary-card { background: #1b1a18; color: #e8e4dc; }
    #dictionary-card[hidden] { display: none; }
    .dictionary-heading { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    .dictionary-heading strong { font-size: 1.25rem; }
    .dictionary-heading span { display: block; opacity: 0.7; font-size: 0.78rem; }
    #dictionary-close {
      border: 0;
      background: transparent;
      color: inherit;
      font-size: 1.6rem;
      line-height: 1;
      padding: 0.25rem 0.4rem;
    }
    #dictionary-card ol { margin: 0.75rem 0 0; padding-left: 1.4rem; }
    #dictionary-card li + li { margin-top: 0.45rem; }
    #dictionary-status { margin: 0.75rem 0 0; opacity: 0.75; }
    #dictionary-source { display: block; margin-top: 0.75rem; color: #2f5d50; }
    body.night #dictionary-source { color: #7fb8a7; }
    #dictionary-context { margin: 0.65rem 0 0; font-size: 0.9rem; line-height: 1.4; opacity: 0.9; }
    #dictionary-context mark { background: #e7c766; color: #1c1916; font-weight: 700; padding: 0 0.08em; }
    #reader-speech-controls {
      position: fixed;
      z-index: 15;
      right: 0.8rem;
      bottom: 1.6rem;
      display: flex;
      gap: 0.35rem;
      align-items: center;
      padding: 0.25rem;
      border: 1px solid color-mix(in srgb, currentColor 22%, transparent);
      border-radius: 999px;
      background: color-mix(in srgb, currentColor 8%, transparent);
      backdrop-filter: blur(4px);
    }
    #reader-speech-controls.hidden { display: none; }
    #reader-speech-controls button {
      width: 2rem;
      height: 2rem;
      padding: 0;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: currentColor;
      font-size: 1rem;
      font-weight: 600;
      line-height: 1;
      cursor: pointer;
    }
    #reader-speech-controls button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
  </style>
  <script src="jszip.min.js"></script>
  <script src="epub.min.js"></script>
  <script src="reader-speech.js"></script>
  <script src="reader-typography.js"></script>
  <script src="reader-chrome.js"></script>
</head>
<body>
  <header class="reader-header" aria-label="Reader controls">
    <svg class="reader-mark" viewBox="0 0 24 24" aria-label="Bookstr" role="img"><path fill="currentColor" d="M3.5 5.2c3-.8 5.8-.2 8.5 1.8v12c-2.7-2-5.5-2.6-8.5-1.8V5.2Zm17 0c-3-.8-5.8-.2-8.5 1.8v12c2.7-2 5.5-2.6 8.5-1.8V5.2Z"/><path fill="#c74b32" d="M12 6.5c-.8-.6-1.6-1-2.5-1.2v2.1c.9.2 1.7.5 2.5 1.1V6.5Zm0 0c.8-.6 1.6-1 2.5-1.2v2.1c-.9.2-1.7.5-2.5 1.1V6.5Z"/></svg>
    <button id="reader-back" type="button" aria-label="Back to library" title="Back to library">‹</button>
    <div class="reader-header-copy">
      <strong id="reader-header-title">Book</strong>
      <span id="reader-header-byline"></span>
    </div>
    <span id="reader-header-rights" aria-label="Rights"></span>
    <div class="reader-menu">
      <button id="reader-menu-toggle" type="button" aria-label="Open menu" aria-expanded="false" title="Menu">☰</button>
      <div id="reader-menu" hidden>
        <button type="button" data-reader-pane="home">Home</button>
        <button type="button" data-reader-pane="reading">Reading</button>
        <button type="button" data-reader-pane="search">Search</button>
        <button type="button" data-reader-pane="people">People</button>
      </div>
    </div>
  </header>
  <div id="viewer"></div>
  <button id="reader-prev" class="reader-nav" type="button" aria-label="Previous page">‹</button>
  <button id="reader-next" class="reader-nav" type="button" aria-label="Next page">›</button>
  <div id="reader-speech-controls" class="hidden" aria-label="Read-aloud controls">
    <button id="reader-speech-play" type="button" aria-label="Start reading">▶</button>
    <button id="reader-speech-pause" type="button" aria-label="Pause or resume reading" disabled>▮▮</button>
    <button id="reader-speech-stop" type="button" aria-label="Stop reading" disabled>⏹</button>
  </div>
  <footer id="reader-footer" aria-label="Reading progress">
    <span id="reader-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="reader-progress-value"></span></span>
    <span id="reader-progress-text">0% read</span>
  </footer>
  <aside id="dictionary-card" hidden aria-live="polite">
    <div class="dictionary-heading">
      <div><strong id="dictionary-word"></strong><span id="dictionary-kind"></span></div>
      <button id="dictionary-close" type="button" aria-label="Close definition">×</button>
    </div>
    <p id="dictionary-status"></p>
    <p id="dictionary-context"></p>
    <ol id="dictionary-definitions"></ol>
    <a id="dictionary-source" target="_blank" rel="noreferrer">Wiktionary</a>
  </aside>
  <script>
/* @bookstr-typescript:reader-app */
</script>
</body>
</html>
